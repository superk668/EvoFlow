- type: Backend
  id: API-GET-Orders
  route: GET /api/orders
  description: 获取当前登录用户的订单列表，支持状态/类型筛选与分页。
  input:
    type: Query
    query:
      status: string
      type: string
      page: number
      pageSize: number
  output:
    success:
      statusCode: 200
      body:
        items:
          - orderId: string
            orderNo: string
            createdAt: string
            type: string
            status: string
            title: string
            departureAt: string
            arrivalAt: string
            totalAmount: number
            travelers:
              - name: string
        page: number
        pageSize: number
        total: number
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 400
        body: { error: "Invalid query." }
  dependencies:
    - DB-ListOrdersByUser
  acceptanceCriteria:
    - 默认按创建时间倒序返回订单卡片所需字段。
    - 支持按状态标签筛选并返回对应订单。
    - 状态标签含义：pending_payment(待支付)；upcoming(未出行/待出行，当前时间早于 departureAt 且已支付)；completed(已完成，当前时间晚于 arrivalAt 且已支付)；canceled(已取消)。
    - 支持按订单类型筛选并返回对应订单。
    - 当分类下无订单时返回 items 为空数组。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-20"
      description: "补充状态标签含义与时间判定规则。"

- type: Backend
  id: API-GET-OrderDetail
  route: GET /api/orders/{orderId}
  description: 获取当前登录用户的订单详情。
  input:
    type: Path
    params:
      orderId: string
  output:
    success:
      statusCode: 200
      body:
        orderId: string
        orderNo: string
        createdAt: string
        type: string
        status: string
        title: string
        departureAt: string
        arrivalAt: string
        travelers:
          - name: string
            idNo: string
        segments:
          - departStation: string
            arriveStation: string
            departAt: string
            arriveAt: string
            transportNo: string
            seatType: string
        priceBreakdown:
          - label: string
            amount: number
        totalAmount: number
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 403
        body: { error: "Forbidden." }
      - statusCode: 404
        body: { error: "Order not found." }
  dependencies:
    - DB-GetOrderByIdForUser
  acceptanceCriteria:
    - 详情页应能展示订单状态、旅客信息、价格明细等字段。
    - 当订单不存在时应返回 404。
    - 当用户无权限访问该订单时应返回 403。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-POST-OrderCancel
  route: POST /api/orders/{orderId}/cancel
  description: 取消指定订单。
  input:
    type: Path
    params:
      orderId: string
  output:
    success:
      statusCode: 200
      body:
        orderId: string
        status: string
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 403
        body: { error: "Forbidden." }
      - statusCode: 404
        body: { error: "Order not found." }
  dependencies:
    - DB-CancelOrderForUser
  acceptanceCriteria:
    - 取消成功后订单状态更新为已取消。
    - 重复请求应保持幂等并返回已取消状态。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-DELETE-Order
  route: DELETE /api/orders/{orderId}
  description: 删除指定订单（软删除）。
  input:
    type: Path
    params:
      orderId: string
  output:
    success:
      statusCode: 204
      body: {}
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 403
        body: { error: "Forbidden." }
      - statusCode: 404
        body: { error: "Order not found." }
  dependencies:
    - DB-SoftDeleteOrderForUser
  acceptanceCriteria:
    - 删除成功后列表页不再返回该订单。
    - 重复删除应保持幂等并返回 204。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-GET-UserProfile
  route: GET /api/user/profile
  description: 获取当前登录用户的个人信息档案。
  input:
    type: Headers
    headers:
      Authorization: string
  output:
    success:
      statusCode: 200
      body:
        userId: string
        phoneNumber: string
        email: string
        nickname: string
        fullName: string
        gender: string
        birthday: string
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 404
        body: { error: "User not found." }
  dependencies:
    - DB-GetUserProfile
  acceptanceCriteria:
    - 需要登录态（Authorization Bearer token）。
    - 返回字段满足个人信息页展示需要。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-PUT-UserProfile
  route: PUT /api/user/profile
  description: 更新当前登录用户的个人信息（昵称、姓名、性别、生日）。
  input:
    type: JSON
    headers:
      Authorization: string
    body:
      nickname: string
      fullName: string
      gender: string
      birthday: string
  output:
    success:
      statusCode: 200
      body:
        success: boolean
        message: string
        profile:
          userId: string
          phoneNumber: string
          email: string
          nickname: string
          fullName: string
          gender: string
          birthday: string
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 400
        body: { error: "Invalid input." }
      - statusCode: 404
        body: { error: "User not found." }
  dependencies:
    - DB-UpdateUserProfile
  acceptanceCriteria:
    - 必填：nickname、fullName、gender；选填：birthday。
    - 当输入不合法时返回 400 并包含原因摘要。
    - 更新成功后返回最新 profile，前端无需刷新即可渲染。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-GET-Travelers
  route: GET /api/user/travelers
  description: 获取当前登录用户的常用旅客信息列表，支持关键字搜索。
  input:
    type: Query
    headers:
      Authorization: string
    query:
      keyword: string
  output:
    success:
      statusCode: 200
      body:
        items:
          - travelerId: string
            cnName: string
            enName: string
            phone: string
            idType: string
            idNo: string
            nationality: string
            gender: string
            birthday: string
            frequentFlyerNo: string
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 400
        body: { error: "Invalid query." }
  dependencies:
    - DB-ListTravelerProfiles
  acceptanceCriteria:
    - keyword 为空时返回全部旅客。
    - keyword 有值时返回匹配姓名或手机号的旅客。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-POST-Travelers
  route: POST /api/user/travelers
  description: 新增一条常用旅客信息。
  input:
    type: JSON
    headers:
      Authorization: string
    body:
      cnName: string
      enName: string
      phone: string
      idType: string
      idNo: string
      nationality: string
      gender: string
      birthday: string
      frequentFlyerNo: string
  output:
    success:
      statusCode: 201
      body:
        travelerId: string
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 400
        body: { error: "Invalid input." }
  dependencies:
    - DB-CreateTravelerProfile
  acceptanceCriteria:
    - cnName、idType（默认身份证）、idNo 为必填。
    - 创建成功后返回 travelerId。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-PUT-Traveler
  route: PUT /api/user/travelers/{travelerId}
  description: 更新指定旅客ID的常用旅客信息。
  input:
    type: JSON
    headers:
      Authorization: string
    params:
      travelerId: string
    body:
      cnName: string
      enName: string
      phone: string
      idType: string
      idNo: string
      nationality: string
      gender: string
      birthday: string
      frequentFlyerNo: string
  output:
    success:
      statusCode: 200
      body:
        travelerId: string
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 400
        body: { error: "Invalid input." }
      - statusCode: 404
        body: { error: "Traveler not found." }
  dependencies:
    - DB-UpdateTravelerProfile
  acceptanceCriteria:
    - 必填字段缺失或不合法时返回 400。
    - 更新成功后返回 travelerId。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-DELETE-Travelers
  route: DELETE /api/user/travelers
  description: 批量删除常用旅客信息（按ID列表）。
  input:
    type: JSON
    headers:
      Authorization: string
    body:
      ids:
        - string
  output:
    success:
      statusCode: 200
      body:
        deletedCount: number
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 400
        body: { error: "Invalid input." }
  dependencies:
    - DB-DeleteTravelerProfiles
  acceptanceCriteria:
    - 支持批量删除；重复删除应保持幂等。
    - 删除成功后返回 deletedCount。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-GET-Flights
  route: GET /api/flights
  description: 按查询参数返回本地模拟的航班搜索结果，支持筛选与排序。
  input:
    type: Query
    query:
      from: string
      to: string
      departDate: string
      airline: string
      departTimeRange: string
      arriveTimeRange: string
      airport: string
      sort: string
      page: number
      pageSize: number
  output:
    success:
      statusCode: 200
      body:
        items:
          - flightId: string
            airlineName: string
            flightNo: string
            departAt: string
            arriveAt: string
            departAirport: string
            arriveAirport: string
            lowestPrice: number
            packages:
              - packageId: string
                name: string
                price: number
                baggage: string
                refundPolicy: string
                priceVersion: string
        page: number
        pageSize: number
        total: number
    error:
      - statusCode: 400
        body: { error: "Invalid query." }
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 500
        body: { error: "Search failed." }
  dependencies:
    - DB-QueryFlights
  acceptanceCriteria:
    - 当 from/to/departDate 合法时返回航班列表。
    - 当无可售结果时返回 items 为空数组。
    - 当数据加载失败时返回 500 并包含错误摘要。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Backend
  id: API-POST-BookingDraft
  route: POST /api/booking/draft
  description: 创建/覆盖机票预订草稿并写入会话（flightId、packageId、departDate、priceVersion）。
  input:
    type: JSON
    body:
      flightId: string
      packageId: string
      departDate: string
      priceVersion: string
  output:
    success:
      statusCode: 201
      body:
        success: boolean
        bookingDraft:
          flightId: string
          packageId: string
          departDate: string
          priceVersion: string
    error:
      - statusCode: 400
        body: { error: "Invalid input." }
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-SaveBookingSession
  acceptanceCriteria:
    - 必须写入 bookingDraft 且字段完整。
    - 创建成功后可通过 API-GET-BookingDraft 读取到。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Backend
  id: API-GET-BookingDraft
  route: GET /api/booking/draft
  description: 读取当前会话中的机票预订草稿。
  input:
    type: none
  output:
    success:
      statusCode: 200
      body:
        bookingDraft:
          flightId: string
          packageId: string
          departDate: string
          priceVersion: string
        bookingStage: number
    error:
      - statusCode: 404
        body: { error: "Booking draft not found." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-LoadBookingSession
  acceptanceCriteria:
    - 当草稿不存在时返回 404。
    - 当读取成功时返回草稿与 stage（若存在）。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Backend
  id: API-PUT-BookingTravelers
  route: PUT /api/booking/travelers
  description: 保存乘机人与联系人信息到会话，用于后续下单与展示。
  input:
    type: JSON
    body:
      passengers:
        - name: string
          idType: string
          idNo: string
          phone: string
      contact:
        regionCode: string
        phone: string
  output:
    success:
      statusCode: 200
      body: { success: true }
    error:
      - statusCode: 400
        body: { error: "Validation failed." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-SaveBookingSession
  acceptanceCriteria:
    - 当证件号不合法时返回 400 并指明原因。
    - 保存成功后可在支付与完成页展示乘机人摘要。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Backend
  id: API-PUT-BookingServices
  route: PUT /api/booking/services
  description: 保存增值服务选择与价格清单到会话。
  input:
    type: JSON
    body:
      selectedServices:
        - serviceId: string
          name: string
          amount: number
      priceBreakdown:
        - label: string
          amount: number
  output:
    success:
      statusCode: 200
      body: { success: true }
    error:
      - statusCode: 400
        body: { error: "Invalid input." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-SaveBookingSession
  acceptanceCriteria:
    - 未选择任何服务时也应允许保存并返回 success。
    - 保存成功后可在下单与完成页用于价格明细展示。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Backend
  id: API-POST-Orders
  route: POST /api/orders
  description: 依据当前会话草稿创建机票订单并写入本地共享订单存储，订单初始状态为 pending_payment。
  input:
    type: JSON
    body:
      productType: string
      bookingDraft:
        flightId: string
        packageId: string
        departDate: string
        priceVersion: string
      totalAmount: number
  output:
    success:
      statusCode: 201
      body:
        orderId: string
        status: string
    error:
      - statusCode: 400
        body: { error: "Invalid input or missing booking draft." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-LoadBookingSession
    - DB-CreateSharedOrder
  acceptanceCriteria:
    - 成功创建后返回 orderId，status 为 pending_payment。
    - 创建的订单可在订单中心与支付页读取。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Backend
  id: API-PATCH-OrderStatus
  route: PATCH /api/orders/{orderId}/status
  description: 更新订单状态（用于支付完成后将 pending_payment 更新为 pending_travel）。
  input:
    type: JSON
    params:
      orderId: string
    body:
      status: string
  output:
    success:
      statusCode: 200
      body:
        orderId: string
        status: string
    error:
      - statusCode: 400
        body: { error: "Invalid status." }
      - statusCode: 404
        body: { error: "Order not found." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-UpdateSharedOrderStatus
  acceptanceCriteria:
    - 当目标状态为 pending_travel 且订单存在时返回 200。
    - 重复请求保持幂等并返回相同状态。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"
