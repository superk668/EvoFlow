- type: Backend
  id: API-POST-Auth-Login-Password
  route: POST /api/auth/login/password
  description: 账号密码登录，支持手机号/邮箱/用户名作为账号。
  input:
    type: JSON
    body:
      account: string
      password: string
  output:
    success:
      statusCode: 200
      body: { userId: "uuid", token: "jwt" }
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Invalid username or password." }
  dependencies:
    - DB-ValidateUserPassword
  acceptanceCriteria:
    - 当账号与密码匹配时返回 200，并返回 userId 与 token。
    - 当账号不存在或密码不匹配时返回 401，并提示用户名或密码不正确。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-POST-Auth-SendSmsCode
  route: POST /api/auth/sms/send
  description: 发送短信验证码（用于验证码登录或手机号注册），并触发 60 秒冷却。
  input:
    type: JSON
    body:
      phoneNumber: string
      purpose: string # login | register
  output:
    success:
      statusCode: 200
      body: { sent: true, cooldownSeconds: 60 }
    error:
      - statusCode: 400
        body: { error: "Invalid phone number." }
      - statusCode: 429
        body: { error: "Too many requests. Please try later." }
  dependencies:
    - DB-StoreSmsVerificationCode
  acceptanceCriteria:
    - 当手机号格式合法且不在冷却期内时返回 200，并开始 60 秒冷却。
    - 当 60 秒内重复请求时返回 429 且不生成新验证码。
    - 生成的 6 位数字验证码应输出到后端终端日志中（不在响应体返回）。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-POST-Auth-Login-Code
  route: POST /api/auth/login/code
  description: 手机验证码登录。
  input:
    type: JSON
    body:
      phoneNumber: string
      verificationCode: string
  output:
    success:
      statusCode: 200
      body: { userId: "uuid", token: "jwt" }
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 404
        body: { error: "Phone number not registered." }
      - statusCode: 401
        body: { error: "Invalid verification code." }
  dependencies:
    - DB-CheckPhoneRegistered
    - DB-VerifySmsVerificationCode
    - DB-ConsumeSmsVerificationCode
    - DB-FindUserByAccount
  acceptanceCriteria:
    - 当手机号已注册且验证码正确时返回 200，并返回 userId 与 token。
    - 当手机号未注册时返回 404，并提示该手机号未注册，请先注册。
    - 当验证码不正确时返回 401，并提示验证码不正确。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-POST-Register-VerifyCode
  route: POST /api/auth/register/verify-code
  description: 注册步骤1校验手机号与验证码，签发用于步骤2的注册令牌。
  input:
    type: JSON
    body:
      phoneNumber: string
      verificationCode: string
  output:
    success:
      statusCode: 200
      body: { registerToken: "opaque" }
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Invalid verification code." }
      - statusCode: 409
        body: { error: "Phone number already registered." }
  dependencies:
    - DB-CheckPhoneRegistered
    - DB-VerifySmsVerificationCode
    - DB-ConsumeSmsVerificationCode
  acceptanceCriteria:
    - 当手机号已注册时返回 409，并提示该手机号已注册，请直接登录。
    - 当手机号未注册且验证码正确时返回 200，并返回 registerToken。
    - 当验证码错误时返回 401，并提示验证码错误。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-POST-Register-Complete
  route: POST /api/auth/register/complete
  description: 注册步骤2设置密码并完成注册。
  input:
    type: JSON
    body:
      registerToken: string
      password: string
  output:
    success:
      statusCode: 201
      body: { userId: "uuid" }
    error:
      - statusCode: 400
        body: { error: "Invalid password format." }
      - statusCode: 401
        body: { error: "Invalid or expired register token." }
      - statusCode: 409
        body: { error: "Phone number already registered." }
  dependencies:
    - DB-CheckPhoneRegistered
    - DB-CreateUser
  acceptanceCriteria:
    - 当密码不符合 8-20 位字母/数字/符号组合规则时返回 400。
    - 当注册令牌无效或过期时返回 401。
    - 当手机号未注册且信息合法时返回 201 并创建用户。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-GET-Flights-Search
  route: GET /api/flights/search
  description: 航班搜索结果查询，支持筛选与分页。
  input:
    type: Query
    params:
      from: string
      to: string
      departDate: string
      airline: string?
      departTimeRange: string?
      aircraft: string?
      cabin: string?
      page: number?
      pageSize: number?
  output:
    success:
      statusCode: 200
      body: { flights: "FlightSummary[]", total: "number" }
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Unauthorized" }
  dependencies:
    - DB-SearchFlights
  acceptanceCriteria:
    - 当查询参数合法时返回航班列表，包含航司/航班号/起降信息/最低价。
    - 当 departDate 为过去日期时返回 400 并提示不可选择过去日期。
    - 当用户未登录访问时返回 401，前端应跳转登录。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-GET-Flights-Packages
  route: GET /api/flights/:flightId/packages
  description: 获取某航班的套餐列表与价格版本。
  input:
    type: Path+Query
    params:
      flightId: string
      departDate: string
  output:
    success:
      statusCode: 200
      body: { packages: "Package[]", priceVersion: "string" }
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 404
        body: { error: "Flight not found." }
  dependencies:
    - DB-GetFlightPackages
  acceptanceCriteria:
    - 返回套餐名称、价格、退改政策、行李额等信息。
    - 当 flightId 不存在时返回 404。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-POST-Booking-Draft
  route: POST /api/booking/drafts
  description: 从结果页选择套餐后创建订票草稿。
  input:
    type: JSON
    body:
      flightId: string
      packageId: string
      departDate: string
      priceVersion: string
  output:
    success:
      statusCode: 201
      body: { bookingDraftId: "uuid", bookingStage: 1 }
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 409
        body: { error: "Price changed." }
      - statusCode: 401
        body: { error: "Unauthorized" }
  dependencies:
    - DB-CreateBookingDraft
  acceptanceCriteria:
    - 当 flightId/packageId/departDate/priceVersion 缺失或无效时返回 400 并提示套餐信息异常。
    - 当 priceVersion 已过期时返回 409 并要求用户确认最新价格。
    - 成功创建后返回 201 与 bookingDraftId，并进入订票流程。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-GET-Booking-Draft
  route: GET /api/booking/drafts/:bookingDraftId
  description: 获取订票草稿详情与当前阶段（用于刷新/恢复流程）。
  input:
    type: Path
    params:
      bookingDraftId: string
  output:
    success:
      statusCode: 200
      body: { bookingDraft: "BookingDraft" }
    error:
      - statusCode: 401
        body: { error: "Unauthorized" }
      - statusCode: 404
        body: { error: "Booking draft not found." }
  dependencies:
    - DB-GetBookingDraft
  acceptanceCriteria:
    - 当草稿存在时返回草稿完整信息与 bookingStage。
    - 当草稿不存在时返回 404。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-PUT-Booking-PassengersContact
  route: PUT /api/booking/drafts/:bookingDraftId/passengers-contact
  description: 保存乘机人与联系人信息，并推进到增值服务阶段。
  input:
    type: JSON
    body:
      passengers: "Passenger[]"
      contact:
