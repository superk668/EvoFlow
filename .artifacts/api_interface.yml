      statusCode: 200
      body: { bookingStage: 2 }
    error:
      - statusCode: 400
        body: { error: "Validation failed." }
      - statusCode: 401
        body: { error: "Unauthorized" }
      - statusCode: 404
        body: { error: "Booking draft not found." }
  dependencies:
    - DB-UpdateBookingPassengerContact
    - DB-SetBookingStage
  acceptanceCriteria:
    - 当证件号或联系人手机号不合法时返回 400，并提示对应字段错误。
    - 保存成功后返回 bookingStage=2。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
