  route: POST /api/booking/drafts/:bookingDraftId/complete
  description: 支付成功后创建订单并进入完成态（幂等）。
  input:
    type: Path
    params:
      bookingDraftId: string
  output:
    success:
      statusCode: 200
      body: { orderId: "uuid", status: "string", createdAt: "string", totalAmount: "number" }
