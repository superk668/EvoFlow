      - statusCode: 400
        body: { error: "No selection." }
      - statusCode: 401
        body: { error: "Unauthorized" }
      - statusCode: 409
        body: { error: "Contains protected traveller." }
      - statusCode: 500
        body: { error: "Delete failed." }
  dependencies:
    - DB-DeleteCommonTravellers
  acceptanceCriteria:
    - 未选择记录时返回 400 并提示请先选择要删除的记录。
    - 包含本人条目时返回 409 并提示包含不可删除的记录。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-GET-Orders
  route: GET /api/orders
  description: 查询当前用户订单列表，支持标签/类型筛选与分页。
  input:
    type: Query
    params:
      tab: string? # all | pending_travel | pending_payment | pending_review
      productType: string? # all | flight | train | hotel
      page: number?
      pageSize: number?
  output:
    success:
      statusCode: 200
      body: { orders: "OrderSummary[]", total: "number", page: "number", pageSize: "number" }
    error:
      - statusCode: 401
        body: { error: "Unauthorized" }
      - statusCode: 500
        body: { error: "Load failed." }
  dependencies:
    - DB-ListOrders
  acceptanceCriteria:
    - 默认按创建时间倒序返回分页列表。
    - 服务异常时返回 500，前端提示订单加载失败，请检查您的网络并重试。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-POST-Orders-Cancel
  route: POST /api/orders/:orderId/cancel
  description: 取消订单（仅待支付或待出行允许）。
  input:
    type: Path
    params:
      orderId: string
  output:
    success:
      statusCode: 200
      body: { canceled: true, status: "canceled" }
    error:
      - statusCode: 401
        body: { error: "Unauthorized" }
      - statusCode: 403
        body: { error: "Forbidden" }
      - statusCode: 409
        body: { error: "Order status not cancellable." }
      - statusCode: 500
        body: { error: "Cancel failed." }
  dependencies:
    - DB-CancelOrder
  acceptanceCriteria:
    - 取消成功后返回 canceled=true 并更新订单状态为已取消。
    - 当订单状态不允许取消时返回 409 并提示取消失败。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-GET-Orders-Download
  route: GET /api/orders/:orderId/download
  description: 生成并下载订单 TXT。
  input:
    type: Path
    params:
      orderId: string
  output:
    success:
      statusCode: 200
      body: { fileName: "string", contentType: "text/plain", content: "string" }
    error:
      - statusCode: 401
        body: { error: "Unauthorized" }
      - statusCode: 403
        body: { error: "Forbidden" }
      - statusCode: 500
        body: { error: "Download failed." }
  dependencies:
    - DB-GenerateOrderTxt
  acceptanceCriteria:
    - 成功时返回 TXT 内容（包含订单号、状态、金额等信息）并供前端触发下载。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"
