  acceptanceCriteria:
    - 当重复触发时不重复创建订单，返回已有 orderId。
    - 当创建失败时提示订单创建失败，稍后查看订单中心。
    - 成功后推进 bookingStage=4。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

