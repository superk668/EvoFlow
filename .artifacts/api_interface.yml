- type: Backend
  id: API-POST-AuthLoginPassword
  route: POST /api/auth/login/password
  description: 使用账号与密码登录。
  input:
    type: JSON
    body:
      account: string
      password: string
  output:
    success:
      statusCode: 200
      body:
        token: string
        userId: uuid
        userDisplayName: string
        phoneNumber: string
        loginAt: string
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Invalid credentials." }
  dependencies:
    - DB-FindUserByAccount
    - DB-CreateAuthSession
  acceptanceCriteria:
    - 当账号与密码匹配时返回 200，并返回 token 与用户基础信息。
    - 当账号不存在或密码不匹配时返回 401。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Backend
  id: API-POST-AuthLoginSmsSend
  route: POST /api/auth/login/sms/send
  description: 为短信验证码登录发送 6 位验证码（开发期在后端终端输出）。
  input:
    type: JSON
    body:
      phoneNumber: string
  output:
    success:
      statusCode: 204
      body: {}
    error:
      - statusCode: 400
        body: { error: "Invalid phone number." }
      - statusCode: 429
        body: { error: "Too many requests." }
  dependencies:
    - DB-StoreSmsCode
  acceptanceCriteria:
    - 当手机号格式合法时生成 6 位验证码并在后端终端输出。
    - 60 秒内重复请求返回 429，不生成新验证码。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Backend
  id: API-POST-AuthLoginSms
  route: POST /api/auth/login/sms
  description: 使用手机号与短信验证码登录。
  input:
    type: JSON
    body:
      phoneNumber: string
      verificationCode: string
  output:
    success:
      statusCode: 200
      body:
        token: string
        userId: uuid
        userDisplayName: string
        phoneNumber: string
        loginAt: string
    error:
      - statusCode: 400
        body: { error: "Invalid phone number." }
      - statusCode: 401
        body: { error: "Invalid verification code." }
      - statusCode: 404
        body: { error: "Phone number not registered." }
  dependencies:
    - DB-FindUserByPhone
    - DB-VerifySmsCode
    - DB-MarkSmsCodeUsed
    - DB-CreateAuthSession
  acceptanceCriteria:
    - 当手机号已注册且验证码正确时返回 200，并返回 token 与用户基础信息。
    - 当验证码不正确时返回 401。
    - 当手机号未注册时返回 404。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Backend
  id: API-POST-AuthRegisterSmsSend
  route: POST /api/auth/register/sms/send
  description: 为手机号注册步骤1发送 6 位短信验证码（开发期在后端终端输出）。
  input:
    type: JSON
    body:
      phoneNumber: string
  output:
    success:
      statusCode: 204
      body: {}
    error:
      - statusCode: 400
        body: { error: "Invalid phone number." }
      - statusCode: 429
        body: { error: "Too many requests." }
  dependencies:
    - DB-StoreSmsCode
  acceptanceCriteria:
    - 当手机号格式合法时生成验证码并在后端终端输出，不要求检查手机号是否已注册。
    - 60 秒内重复请求返回 429。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Backend
  id: API-POST-AuthRegisterVerifyPhone
  route: POST /api/auth/register/verify-phone
  description: 校验注册步骤1的手机号与验证码，签发注册流程 token 进入设置密码步骤2。
  input:
    type: JSON
    body:
      phoneNumber: string
      verificationCode: string
  output:
    success:
      statusCode: 200
      body:
        registerToken: string
        phoneNumberMasked: string
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Invalid verification code." }
  dependencies:
    - DB-VerifySmsCode
    - DB-MarkSmsCodeUsed
  acceptanceCriteria:
    - 当手机号格式合法且验证码正确时返回 registerToken，并允许进入步骤2。
    - 当验证码错误时返回 401。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Backend
  id: API-POST-AuthRegisterComplete
  route: POST /api/auth/register/complete
  description: 完成注册（设置密码并创建用户）。
  input:
    type: JSON
    body:
      registerToken: string
      password: string
      confirmPassword: string
  output:
    success:
      statusCode: 201
      body:
        userId: uuid
        phoneNumber: string
    error:
      - statusCode: 400
        body: { error: "Invalid password or mismatch." }
      - statusCode: 401
        body: { error: "Invalid register token." }
      - statusCode: 409
        body: { error: "Phone number already registered." }
  dependencies:
    - DB-FindUserByPhone
    - DB-CreateUser
  acceptanceCriteria:
    - 当密码满足 8-20 位字母/数字/符号组合且两次输入一致时返回 201。
    - 当手机号已注册时返回 409。
    - 当密码不合法或两次不一致时返回 400。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Backend
  id: API-POST-AuthLogout
  route: POST /api/auth/logout
  description: 退出登录并吊销当前 token。
  input:
    type: Header
    headers:
      Authorization: string
  output:
    success:
      statusCode: 204
      body: {}
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
  dependencies:
    - DB-RevokeAuthSession
  acceptanceCriteria:
    - 当用户已登录时返回 204，并使 token 失效。
    - 当 token 缺失或无效时返回 401。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Backend
  id: API-GET-AuthMe
  route: GET /api/auth/me
  description: 获取当前登录用户信息，用于刷新后恢复登录态。
  input:
    type: Header
    headers:
      Authorization: string
  output:
    success:
      statusCode: 200
      body:
        userId: uuid
        userDisplayName: string
        phoneNumber: string
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
  dependencies:
    - DB-FindUserByAccount
  acceptanceCriteria:
    - 当 token 有效时返回 200 与用户信息。
    - 当 token 无效时返回 401。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Backend
  id: API-GET-BookingDraft
  route: GET /api/booking/draft
  description: 获取当前会话中的订票草稿（用于订票/增值服务/支付/完成页一致性校验）。
  input:
    type: Header
    headers:
      Authorization: string
  output:
    success:
      statusCode: 200
      body:
        bookingDraft: object
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 404
        body: { error: "Booking draft not found." }
      - statusCode: 422
        body: { error: "Booking draft parse failed." }
  dependencies:
    - DB-GetBookingDraft
  acceptanceCriteria:
    - 当草稿存在且解析成功时返回 200 与 bookingDraft。
    - 当草稿不存在时返回 404。
    - 当草稿解析失败时返回 422。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-PUT-BookingDraft
  route: PUT /api/booking/draft
  description: 写入/更新订票草稿（由结果页预订/订票页下一步触发）。
  input:
    type: JSON
    body:
      flightId: string
      packageId: string
      departDate: string
      priceVersion: string
      passenger: object
      contact: object
      services: array
      stage: string
  output:
    success:
      statusCode: 204
      body: {}
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-UpsertBookingDraft
  acceptanceCriteria:
    - 写入时字段名必须与既定草稿结构一致。
    - 写入失败返回 500。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-DELETE-BookingDraft
  route: DELETE /api/booking/draft
  description: 清理订票草稿（用于完成后或流程中断时回收）。
  input:
    type: Header
    headers:
      Authorization: string
  output:
    success:
      statusCode: 204
      body: {}
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
  dependencies:
    - DB-DeleteBookingDraft
  acceptanceCriteria:
    - 多次调用返回幂等成功。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-POST-OrdersFlight
  route: POST /api/orders/flight
  description: 从订票草稿与已选增值服务生成订单并落盘到共享订单存储。
  input:
    type: JSON
    body:
      draft: object
  output:
    success:
      statusCode: 201
      body:
        orderId: string
        status: string
        expiresAt: string
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 409
        body: { error: "Duplicate order create." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-CreateFlightOrder
  acceptanceCriteria:
    - 创建成功返回 201 并返回 orderId、status=pending_payment、expiresAt（15分钟倒计时基准）。
    - 当检测到重复创建（同一会话已创建 createdOrderId）返回 409。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "调整请求体字段为 draft，与前端实现保持一致。"

- type: Backend
  id: API-GET-Orders
  route: GET /api/orders
  description: 查询订单列表（默认查询机票订单）。
  input:
    type: Query
    query:
      productType: string
  output:
    success:
      statusCode: 200
      body:
        orders: array
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 422
        body: { error: "Orders parse failed." }
  dependencies:
    - DB-ListOrders
  acceptanceCriteria:
    - 当 productType=flight 时仅返回机票订单。
    - 解析失败返回 422。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-GET-OrderById
  route: GET /api/orders/:orderId
  description: 获取订单详情（用于订单详情页/支付页渲染）。
  input:
    type: Path
    params:
      orderId: string
  output:
    success:
      statusCode: 200
      body:
        order: object
    error:
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 404
        body: { error: "Order not found." }
      - statusCode: 422
        body: { error: "Order parse failed." }
  dependencies:
    - DB-GetOrderById
  acceptanceCriteria:
    - 订单存在时返回 200。
    - 订单不存在返回 404。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Backend
  id: API-PATCH-OrderStatus
  route: PATCH /api/orders/:orderId/status
  description: 更新订单状态（完成页将 pending_payment 更新为 pending_travel）。
  input:
    type: Path
    params:
      orderId: string
  output:
    success:
      statusCode: 204
      body: {}
    error:
      - statusCode: 400
        body: { error: "Invalid status." }
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 404
        body: { error: "Order not found." }
      - statusCode: 500
        body: { error: "Storage error." }
  dependencies:
    - DB-UpdateOrderStatus
  acceptanceCriteria:
    - 更新成功返回 204。
    - 状态不合法返回 400。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "调整为仅依赖路径参数 orderId，适配完成页无请求体调用。"

- type: Backend
  id: API-POST-OrderPay
  route: POST /api/orders/:orderId/pay
  description: 模拟支付下单（校验倒计时、卡信息与乘机人一致性）。
  input:
    type: JSON
    body:
      payMethod: string
      newCard: object
  output:
    success:
      statusCode: 200
      body:
        paidAt: string
        nextRoute: string
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 404
        body: { error: "Order not found." }
      - statusCode: 409
        body: { error: "Payment expired." }
      - statusCode: 422
        body: { error: "Passenger info inconsistent." }
      - statusCode: 500
        body: { error: "Payment failed." }
  dependencies:
    - DB-GetOrderById
    - DB-GetBookingDraft
  acceptanceCriteria:
    - 倒计时到期返回 409。
    - 乘机人与联系人信息缺失或与草稿不一致返回 422。
    - 成功支付返回 200 且 nextRoute 指向 /buy-ticket/step4 或 /booking/complete。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "移除请求体中的 orderId 字段，订单号由路径参数提供。"

- type: Backend
  id: API-POST-UserCenterMyInfo
  route: POST /api/user-center/my-info
  description: 同步“我的信息”编辑结果到后端（本地已保存后可失败兜底）。
  input:
    type: JSON
    body:
      nickname: string
      name: string
      gender: string
      birthday: string
  output:
    success:
      statusCode: 204
      body: {}
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 401
        body: { error: "Unauthorized." }
      - statusCode: 409
        body: { error: "Profile conflict." }
      - statusCode: 500
        body: { error: "Server error." }
  dependencies:
    - none
  acceptanceCriteria:
    - 当请求字段校验通过时返回 2xx。
    - 当发生版本冲突时返回 409 且不要求覆盖本地最新数据。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
