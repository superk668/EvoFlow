  acceptanceCriteria:
    - 当服务不可用时返回 400 并提示服务暂不可用。
    - 保存成功后返回 bookingStage=3。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
  id: API-POST-Booking-Pay
  route: POST /api/booking/drafts/:bookingDraftId/pay
  description: 创建支付意图并提交支付，返回支付结果或失败原因。
  input:
    type: JSON
    body:
      paymentMethod: string # saved_card | new_card
      newCard: object?
  output:
    success:
      statusCode: 200
      body: { paid: true }
    error:
      - statusCode: 400
        body: { error: "Invalid payment info." }
      - statusCode: 408
        body: { error: "Payment timeout." }
      - statusCode: 500
        body: { error: "Payment failed." }
  dependencies:
    - DB-CreatePaymentIntent
    - DB-RecordPaymentResult
  acceptanceCriteria:
    - 当新卡信息不完整或格式错误时返回 400 并阻止支付。
    - 当倒计时到期时返回 408 并提示超出时间，请重新开始订单。
    - 支付失败时返回 500 并提示支付失败，请稍后重试。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Backend
