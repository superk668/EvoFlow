- type: Frontend
  id: UI-LoginPage
  description: 登录页面（账号密码登录与验证码登录切换），负责输入、校验与提交。
  properties:
    - name: onLoginSuccess
      type: function
      description: "登录成功后的回调（跳转至携程登录后的首页）。"
  state:
    - activeTab
    - account
    - password
    - phoneNumber
    - code
    - agreeTerms
    - isRequestingCode
    - resendCountdown
    - isSubmitting
    - errorMessage
    - fieldErrors
  dependencies:
    - API-POST-AuthSmsSend
    - API-POST-AuthLoginPassword
    - API-POST-AuthLoginSms
  acceptanceCriteria:
    - 默认展示“账号密码登录”Tab。
    - 展示“忘记密码”链接与第三方登录入口区域。
    - 点击“发送验证码”时调用 API-POST-AuthSmsSend(type=login)，成功后开始 60 秒倒计时。
    - 账号密码登录成功后应触发 onLoginSuccess，并跳转至携程登录后的首页。
    - 手机号验证码登录成功后应触发 onLoginSuccess，并跳转至携程登录后的首页。
    - 账号或密码为空时，分别显示“请输入用户名”“请输入密码”。
    - 未勾选服务协议时，显示“请阅读并同意服务协议”并阻止提交。
    - 账号密码不正确时显示“用户名或密码不正确”。
    - 验证码错误时显示“验证码不正确”。
    - 手机号未注册的验证码登录，显示“该手机号未注册，请先注册”。
    - 点击“免费注册”应导航至注册流程页（URL Hash 为 `#/register/step1`）。
  changeLog:
    - date: "2025-12-20"
      description: "初始创建。"
    - date: "2025-12-20"
      description: "补充忘记密码与第三方登录入口的验收标准，并同步倒计时状态命名。"
    - date: "2026-01-14"
      description: "明确两种登录方式成功后均跳转至登录后的首页。"

- type: Frontend
  id: UI-RegisterStep1Page
  description: 注册流程步骤1（验证手机），负责手机号与验证码输入、协议勾选与下一步。
  properties:
    - name: onVerified
      type: function
      description: "校验通过后的回调（携带 verificationToken 与手机号进入步骤2）。"
  state:
    - phoneNumber
    - code
    - agreeTerms
    - isRequestingCode
    - resendCountdown
    - isSubmitting
    - errorMessage
    - fieldErrors
  dependencies:
    - API-POST-AuthSmsSend
    - API-POST-AuthRegisterVerifyPhone
  acceptanceCriteria:
    - 点击“发送验证码”时调用 API-POST-AuthSmsSend(type=register)，成功后开始 60 秒倒计时。
    - 手机号格式不正确时，显示“手机号格式不正确，请重新输入”，并保持在步骤1。
    - 验证码错误时，在验证码输入框下方显示“验证码错误”。
    - 当手机号已注册时，显示“该手机号已注册，请直接登录”。
    - 验证通过后调用 onVerified 并导航到步骤2（URL Hash 为 `#/register/step2`）。
  changeLog:
    - date: "2025-12-20"
      description: "初始创建。"
    - date: "2025-12-20"
      description: "同步倒计时状态命名。"

- type: Frontend
  id: UI-RegisterStep2Page
  description: 注册流程步骤2（设置密码），负责密码强度展示、二次确认与完成注册。
  properties:
    - name: onRegisterSuccess
      type: function
      description: "注册成功后的回调（例如跳转登录页或直接进入首页）。"
  state:
    - phoneNumberMasked
    - password
    - confirmPassword
    - passwordStrength
    - showPassword
    - showConfirmPassword
    - isSubmitting
    - fieldErrors
    - errorMessage
  dependencies:
    - API-POST-AuthRegisterComplete
  acceptanceCriteria:
    - 手机号显示栏需按前三位、四位星号、后四位格式展示。
    - 密码不符合 8-20 位字母、数字和符号组合时显示“密码需为8-20位字母、数字和符号的组合”，并禁用“完成”。
    - 两次输入密码不一致时显示“两次输入密码不一致”，并禁用“完成”。
    - 点击眼睛按钮可切换明文/密文显示。
    - 点击“完成”调用 API-POST-AuthRegisterComplete，成功后触发 onRegisterSuccess 并导航到登录页（URL Hash 为 `#/login`）。
    - 当手机号已注册时，显示“该手机号已注册”并阻止注册。
  changeLog:
    - date: "2025-12-20"
      description: "初始创建。"
    - date: "2025-12-20"
      description: "补充手机号显示栏掩码规则验收标准。"

- type: Frontend
  id: UI-TopHeaderAuthNav
  description: 顶部导航中的登录/注册/我的订单入口，负责跳转到对应页面。
  properties:
    - name: onNavigate
      type: function
      description: "点击登录/注册后的导航回调（可选）。"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 顶部栏在任何页面都必须提供“首页”入口，点击导航至 `#/`。
    - 点击“登录”应导航至 `#/login`。
    - 点击“注册”应导航至 `#/register/step1`。
    - 未登录点击“我的订单”应导航至 `#/login`。
    - 已登录点击“我的订单”应导航至 `#/user/orders`。
  changeLog:
    - date: "2025-12-20"
      description: "初始创建。"
    - date: "2025-12-28"
      description: "增加“我的订单”入口导航验收标准，并扩展组件描述。"
    - date: "2026-01-15"
      description: "补充未登录点击“我的订单”跳转登录页的验收标准。"
    - date: "2026-01-15"
      description: "补充顶部栏“首页”入口在任意页面可用的验收标准。"

- type: Frontend
  id: UI-OrderManagementPage
  description: 订单管理列表页（个人中心-订单），负责加载、筛选、分页、批量下载与跳转详情。
  properties:
    - name: onNavigateOrderDetail
      type: function
      description: "点击订单详情后的导航回调（可选）。"
  state:
    - activeTab
    - productType
    - page
    - pageSize
    - selectedOrderIds
    - isLoading
    - errorMessage
    - items
    - totalCount
  dependencies:
    - API-GET-Orders
    - API-GET-OrdersDownloadAllTxt
    - API-POST-OrdersBatchDownloadTxt
    - API-GET-OrderDownloadTxt
    - API-POST-OrderPay
    - API-GET-OrdersDownloadAllPdf
    - API-POST-OrdersBatchDownloadPdf
    - API-GET-OrderDownloadPdf
  acceptanceCriteria:
    - 默认激活“全部订单”标签，并发起列表加载请求。
    - 数据加载时显示 Loading Indicator。
    - 加载失败时显示错误提示与“重试”按钮。
    - 无订单时显示空状态提示“您还没有相关订单哦”。
    - 切换“未出行/待支付/待点评”标签时应重新请求并刷新列表。
    - 选择订单后点击“下载”应生成订单 PDF 文件并下载。
    - 点击“下载历史所有订单”应生成全部订单 PDF 文件并下载。
    - 点击订单的“查看详情”应导航到 `#/user/orders/:orderId`。
    - 在“待支付”分类中，点击“支付”按钮应调用 API-POST-OrderPay，成功后刷新列表并在 UI 中展示“支付成功”提示，且该订单状态应更新为“待点评”。
  changeLog:
    - date: "2025-12-28"
      description: "初始创建。"
    - date: "2026-01-14"
      description: "新增待支付订单的支付流程验收标准与依赖。"
    - date: "2026-01-15"
      description: "补充订单下载为 PDF 的验收标准与接口依赖。"

- type: Frontend
  id: UI-HomePage
  description: 首页（未登录/登录后），包含顶部栏导航、搜索区与首页内容承载。
  properties:
    - name: variant
      type: string
      description: "页面形态：guest 或 authed。"
  state:
    - none
  dependencies:
    - UI-TopHeaderAuthNav
    - UI-TopHeaderUserMenu
  acceptanceCriteria:
    - 未登录形态应展示登录/注册入口。
    - 未登录点击“登录”应跳转至登录页。
    - 未登录点击“注册”应跳转至注册页。
    - 未登录点击“我的订单”应跳转至登录页。
    - 登录后形态应展示用户账号信息（用户名/头像）。
    - 登录后点击“我的订单”应跳转至“我的订单”页面。
    - 登录后跳转至首页时，“用户名”展示为用户注册的 ID。
  changeLog:
    - date: "2026-01-15"
      description: "初始创建。"

- type: Frontend
  id: UI-TopHeaderUserMenu
  description: 顶部栏用户账号信息与下拉菜单（登录后）。
  properties:
    - name: userId
      type: string
      description: "当前登录用户的注册 ID。"
  state:
    - isMenuOpen
  dependencies:
    - none
  acceptanceCriteria:
    - 页面初始状态下拉菜单默认收起，不展示菜单选项。
    - 顶部栏“用户名”必须展示为后端返回的 `user.id`，禁止使用静态占位文案。
    - 在 token 未失效时刷新页面，顶部栏仍应展示同一 `user.id`。
    - 顶部栏展示用户名与头像，点击后展开/收起下拉菜单。
    - 下拉菜单至少包含“我的订单”“常用信息”“账户设置”入口。
    - 点击“我的订单”应导航至 `#/user/orders`。
    - 点击“常用信息”应导航至 `#/user/common-traveler`。
    - 点击“账户设置”应导航至 `#/user/set-information`。
    - 点击头像或用户名应导航至“个人信息”页面（`#/user`）。
  changeLog:
    - date: "2026-01-15"
      description: "初始创建。"
    - date: "2026-01-15"
      description: "补充下拉菜单默认收起的验收标准。"
    - date: "2026-01-15"
      description: "补充顶部栏用户名展示为 user.id 且刷新保持的验收标准。"

- type: Frontend
  id: UI-TopHeader
  description: 全局顶部栏组件，包含 Logo、搜索框与右侧导航入口。
  properties:
    - name: variant
      type: string
      description: "形态：guest 或 authed。"
  state:
    - none
  dependencies:
    - UI-TopHeaderAuthNav
    - UI-TopHeaderUserMenu
  acceptanceCriteria:
    - 顶部栏需展示携程旅行网 Logo。
    - Logo 区域在任意页面可作为“首页”入口，点击导航至 `#/`。
    - 顶部栏需展示搜索框占位文案“搜索目的地/酒店/景点/航班号”。
    - guest 形态下展示“登录/注册/我的订单”等入口（由 UI-TopHeaderAuthNav 覆盖跳转规则）。
    - authed 形态下展示用户账号信息与下拉菜单（由 UI-TopHeaderUserMenu 覆盖用户名与菜单规则）。
  changeLog:
    - date: "2026-01-15"
      description: "初始创建。"

- type: Frontend
  id: UI-UserCenterSideBar
  description: 个人信息中心侧边栏导航，包含“个人信息”“常用信息”“订单管理”与下拉项。
  properties:
    - name: activeSection
      type: string
      description: "当前激活的侧边栏区域。"
  state:
    - isPersonalMenuOpen
    - isCommonMenuOpen
  dependencies:
    - none
  acceptanceCriteria:
    - 初始状态下，“个人信息下拉栏”与“常用信息下拉栏”默认收起。
    - 点击“个人信息”下拉触发区，应展开/收起其下拉菜单。
    - 点击“常用信息”下拉触发区，应展开/收起其下拉菜单。
    - 展开状态下应展示对应子项入口（需求范围内仅实现个人信息设置与常用旅客信息设置）。
  changeLog:
    - date: "2026-01-15"
      description: "初始创建。"

- type: Frontend
  id: UI-PersonalInformationPage
  description: 个人信息设置页面，支持查看、编辑与保存个人信息。
  properties:
    - name: userId
      type: string
      description: "当前登录用户 ID。"
  state:
    - isEditing
    - form
    - isSubmitting
    - errorMessage
    - successMessage
  dependencies:
    - API-GET-UserProfile
    - API-PUT-UserProfile
  acceptanceCriteria:
    - 默认展示只读信息与“编辑”按钮。
    - 点击“编辑”后展示可编辑输入框与“保存”按钮。
    - 保存时校验输入有效，成功后提示“个人信息已更新”。
    - 当输入无效时提示“请输入正确的个人信息”且不保存。
    - 保存成功后顶部栏与相关页面应展示最新信息（如用户名、手机号）。
  changeLog:
    - date: "2026-01-15"
      description: "初始创建。"

- type: Frontend
  id: UI-CommonTravelerPage
  description: 常用旅客信息设置页面，支持新增、删除与查找常用旅客。
  properties:
    - name: userId
      type: string
      description: "当前登录用户 ID。"
  state:
    - keyword
    - items
    - isLoading
    - isSubmitting
    - errorMessage
    - successMessage
    - editingTraveler
  dependencies:
    - API-GET-CommonTravelers
    - API-POST-CommonTraveler
    - API-DELETE-CommonTraveler
  acceptanceCriteria:
    - 页面应展示旅客列表、搜索框与“新增”按钮。
    - 点击“新增”进入输入信息界面，保存时校验姓名、手机号、证件类型、证件号有效。
    - 新增/编辑界面中，“国家/地区”与“手机号码前缀（国家码）”应提供下拉可选项列表。
    - 保存成功后提示“常用旅客信息已更新”并在列表中展示新增旅客。
    - 保存失败时提示“请输入正确的常用旅客相关信息”且不保存。
    - 选择旅客点击“删除”应删除记录并提示“常用旅客信息已删除”。
    - 在搜索框输入姓名或手机号应触发查找并展示匹配结果。
  changeLog:
    - date: "2026-01-15"
      description: "初始创建。"
    - date: "2026-01-15"
      description: "补充新增/编辑常用旅客的国家/地区与电话前缀下拉选项验收标准。"

- type: Frontend
  id: UI-SetInformationPage
  description: 账户设置页面入口（需求范围内可作为占位页面）。
  properties:
    - name: userId
      type: string
      description: "当前登录用户 ID。"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 页面可从用户下拉菜单“账户设置”进入。
  changeLog:
    - date: "2026-01-15"
      description: "初始创建。"

- type: Frontend
  id: UI-OrderDetailPage
  description: 订单详情页，展示订单状态、行程信息、旅客与联系信息、价格明细，并支持取消与重新下单。
  properties:
    - name: orderId
      type: string
      description: "路由参数中的订单号。"
  state:
    - isLoading
    - errorMessage
    - order
    - isCancelling
    - isRebooking
  dependencies:
    - API-GET-OrderDetail
    - API-POST-OrderCancel
    - API-POST-OrderRebook
  acceptanceCriteria:
    - 页面加载时应请求订单详情并显示 Loading Indicator。
    - 当订单不存在或无权限时，应显示“订单不存在或您没有权限查看”。
    - 当订单为已取消或已完成时，不应展示“取消订单”按钮。
    - 当订单为待支付或待出行时，点击“取消订单”需弹出浏览器确认框。
    - 确认取消成功后提示“订单取消成功”，并刷新状态为“已取消”。
    - 点击“重新下单”时应调用重下单接口并按返回 redirectUrl 跳转。
  changeLog:
    - date: "2025-12-28"
      description: "初始创建。"
