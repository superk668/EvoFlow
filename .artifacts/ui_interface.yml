    - profile
    - isEditing
    - fieldErrors
    - isLoading
    - submitError
  dependencies:
    - UI-UserCenterSideNav
    - API-GET-UserProfile
    - API-PUT-UserProfile
  acceptanceCriteria:
    - 默认以只读态展示脱敏手机与邮箱状态，并展示“编辑”入口。
    - 点击“编辑”进入编辑态，点击“收起”返回只读态。
    - 昵称为空或超过 20 字符时提示“请输入昵称（不超过20字符）”并阻止保存。
