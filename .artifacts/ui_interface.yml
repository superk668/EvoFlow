- type: Frontend
  id: UI-LoginPage
  description: 登录页面容器，提供账号密码登录/验证码登录 Tab 切换与统一错误提示区。
  properties:
    - name: onLoginSuccess
      type: function
      description: "登录成功后的回调（跳转首页或返回上一页）。"
  state:
    - activeTab
    - agreeToTerms
    - globalError
  dependencies:
    - UI-LoginPasswordForm
    - UI-LoginSmsForm
  acceptanceCriteria:
    - 默认展示“账号密码登录”Tab。
    - Tab 可在“账号密码登录”和“验证码登录”间切换。
    - 未勾选服务协议时点击登录应提示并阻止提交。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-LoginPasswordForm
  description: 账号密码登录表单，支持手机号/邮箱/用户名作为账号。
  properties:
    - name: agreeToTerms
      type: boolean
      description: "是否已勾选服务协议。"
    - name: onLoginSuccess
      type: function
      description: "登录成功后的回调。"
  state:
    - account
    - password
    - accountError
    - passwordError
    - termsError
    - submitError
    - isLoading
  dependencies:
    - API-POST-Auth-Login-Password
  acceptanceCriteria:
    - 未输入账号点击登录时在账号输入框下方提示“请输入用户名”。
    - 未输入密码点击登录时在密码输入框下方提示“请输入密码”。
    - 账号或密码错误时显示“用户名或密码不正确”，并停留在登录页。
    - 登录成功后触发 onLoginSuccess。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-LoginSmsForm
  description: 手机验证码登录表单，包含发送验证码、60 秒倒计时与验证码输入。
  properties:
    - name: agreeToTerms
      type: boolean
      description: "是否已勾选服务协议。"
    - name: onLoginSuccess
      type: function
      description: "登录成功后的回调。"
  state:
    - phoneNumber
    - verificationCode
    - phoneError
    - codeError
    - termsError
    - toastError
    - isSending
    - cooldownSecondsLeft
    - isLoading
  dependencies:
    - API-POST-Auth-SendSmsCode
    - API-POST-Auth-Login-Code
  acceptanceCriteria:
    - 手机号不合法时在验证码输入框与登录按钮之间提示“手机号格式不正确，请重新输入”。
    - 获取验证码后按钮进入不可点击状态并开始 60 秒倒计时。
    - 验证码错误时提示“验证码不正确”。
    - 手机号未注册时提示“该手机号未注册，请先注册”。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-RegisterStep1
  description: 注册步骤1（验证手机），包含发送验证码与“下一步，设置密码”。
  properties:
    - name: onStep1Success
      type: function
      description: "步骤1校验通过后的回调（进入步骤2）。"
  state:
    - phoneNumber
    - verificationCode
    - phoneError
    - codeError
    - toastError
    - isSending
    - cooldownSecondsLeft
    - isLoading
    - registerToken
  dependencies:
    - API-POST-Auth-SendSmsCode
    - API-POST-Register-VerifyCode
  acceptanceCriteria:
    - 手机号不合法时提示“手机号格式不正确，请重新输入”，手机号输入栏呈警示状态。
    - 60 秒内重复获取验证码按钮无响应且倒计时继续。
    - 验证码错误时在验证码输入框下方提示“验证码错误”。
    - 手机号已注册时提示“该手机号已注册，请直接登录”。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-RegisterStep2
  description: 注册步骤2（设置密码），包含强度提示、确认密码与明文/密文切换。
  properties:
    - name: registerToken
      type: string
      description: "步骤1成功后获得的注册令牌。"
    - name: maskedPhoneNumber
      type: string
      description: "用于展示的脱敏手机号。"
    - name: onRegisterSuccess
      type: function
      description: "注册成功回调（跳转登录页）。"
    - name: onBack
      type: function
      description: "返回上一步回调。"
  state:
    - password
    - confirmPassword
    - passwordStrength
    - isPasswordVisible
    - passwordError
    - confirmPasswordError
    - submitError
    - isLoading
  dependencies:
    - API-POST-Register-Complete
    - UI-PasswordStrengthIndicator
  acceptanceCriteria:
    - 密码不符合 8-20 位字母/数字/符号组合时提示“密码需为8-20位字母、数字和符号的组合”，完成按钮不可点。
    - 两次密码不一致时提示“两次输入密码不一致”，完成按钮不可点。
    - 点击可视化按钮可在明文与密文显示间切换。
    - 注册成功后触发 onRegisterSuccess 并跳转至登录页。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-PasswordStrengthIndicator
  description: 密码强度提示组件，展示弱/中/强三个矩形高亮状态。
  properties:
    - name: strength
      type: string
      description: "weak | medium | strong | none"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 未输入或不符合规则时三格均为灰色。
    - 强度为弱/中/强时分别点亮 1/2/3 格。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-HomeUserMenu
  description: 首页顶部用户名区域的下拉菜单（触摸/悬停显示）。
  properties:
    - name: username
      type: string
      description: "登录用户显示名。"
  state:
    - isOpen
  dependencies:
    - UI-NavigationToProfile
    - UI-NavigationToCommonTravellers
    - UI-NavigationToOrders
  acceptanceCriteria:
    - 用户触摸用户名位置时展示下拉菜单。
    - 点击菜单中的“用户名”跳转到个人中心-我的信息。
    - 点击菜单中的“常用信息”跳转到个人中心-常用旅客信息。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-NavigationToProfile
  description: 导航到个人中心“我的信息”。
  properties:
    - name: to
      type: string
      description: "默认 /user-center/my-info。"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 触发后路由跳转至 /user-center/my-info。
    - 当应用启用旧路由兼容时允许跳转到 /personal/profile。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"
    - date: "2026-01-17"
      description: "适配设置需求的 /user-center/my-info 路由。"

- type: Frontend
  id: UI-NavigationToCommonTravellers
  description: 导航到个人中心“常用旅客信息”。
  properties:
    - name: to
      type: string
      description: "默认 /user-center/common-info/travelers。"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 触发后路由跳转至 /user-center/common-info/travelers。
    - 当应用启用旧路由兼容时允许跳转到 /personal/common-info/travellers。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"
    - date: "2026-01-17"
      description: "适配设置需求的 /user-center/common-info/travelers 路由。"

- type: Frontend
  id: UI-NavigationToOrders
  description: 导航到个人订单中心。
  properties:
    - name: to
      type: string
      description: "默认 /user-center/orders。"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 触发后路由跳转至 /user-center/orders。
    - 当应用启用旧路由兼容时允许跳转到 /personal/orders。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"
    - date: "2026-01-17"
      description: "适配设置需求的 /user-center/orders 路由。"

- type: Frontend
  id: UI-FlightsListPage
  description: 航班搜索结果页，展示列表、快捷筛选与套餐面板。
  properties:
    - name: query
      type: object
      description: "from/to/departDate 等查询参数。"
  state:
    - filters
    - flights
    - isLoading
    - error
    - expandedFlightId
  dependencies:
    - API-GET-Flights-Search
    - API-GET-Flights-Packages
    - API-POST-Booking-Draft
    - UI-FlightsFilterBar
    - UI-FlightCard
    - UI-FlightPackagePanel
  acceptanceCriteria:
    - 正常加载时展示航班列表与最低价，并可展开套餐面板。
    - 当 departDate 为过去日期时提示“不可选择过去日期”，保持在本页并允许重选日期。
    - 搜索接口失败时提示“搜索失败/网络异常，请稍后重试”。
    - 无可售结果时提示“暂无可售航班”。
    - 未登录访问或预订时应跳转登录，登录后返回结果页继续。
    - 当套餐 ID 缺失或无效时阻止进入订票页并提示“套餐信息异常，请重试”。
    - 当后端返回价格已更新时提示价格变更并要求用户确认，确认后按最新价格继续预订。
    - 刷新或分享带查询参数的 URL 时保留筛选状态并重新加载列表。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"
    - date: "2026-01-17"
      description: "补充筛选持久化与异常场景验收。"

- type: Frontend
  id: UI-BookingStep1
  description: 订票页面（乘机人与联系人信息）。
  properties:
    - name: bookingDraftId
      type: string
      description: "订票草稿 ID。"
  state:
    - passengers
    - contact
    - fieldErrors
    - isLoading
    - submitError
  dependencies:
    - API-GET-Booking-Draft
    - API-PUT-Booking-PassengersContact
    - UI-BookingProgressHeader
    - UI-BookingPassengerForm
    - UI-BookingContactForm
  acceptanceCriteria:
    - 证件号格式错误时在证件号下方提示“证件号码格式不正确”。
    - 联系人手机号非法时提示“联系人手机号格式不正确”。
    - 点击下一步成功后进入增值服务页并推进阶段。
    - 当保存到会话失败时提示“网络异常，请稍后重试”并保留已填写数据。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"
    - date: "2026-01-17"
      description: "补充会话持久化失败的验收。"

- type: Frontend
  id: UI-BookingStep2
  description: 增值服务页面，展示服务选项与价格清单。
  properties:
    - name: bookingDraftId
      type: string
      description: "订票草稿 ID。"
  state:
    - services
    - selectedServiceIds
    - priceSummary
    - isLoading
    - error
  dependencies:
    - API-GET-Booking-Services
    - API-PUT-Booking-Services
    - UI-BookingProgressHeader
    - UI-BookingServicesList
    - UI-BookingOrderSummaryCard
  acceptanceCriteria:
    - 服务不可用时提示“服务暂不可用”并取消勾选。
    - 服务列表加载失败时显示占位并允许继续至支付。
    - 点击下一步后进入支付页并推进阶段。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingStep3
  description: 支付页面，展示倒计时与支付方式并提交支付。
  properties:
    - name: bookingDraftId
      type: string
      description: "订票草稿 ID。"
  state:
    - countdownSecondsLeft
    - paymentMethod
    - newCardForm
    - fieldErrors
    - isLoading
    - submitError
  dependencies:
    - API-POST-Booking-Pay
    - UI-BookingProgressHeader
    - UI-PaymentCountdownTimer
    - UI-PaymentMethodSelector
    - UI-BookingOrderSummaryCard
  acceptanceCriteria:
    - 当倒计时归零时提示“超出时间，请重新开始订单”，并提供返回首页入口。
    - 新卡信息不完整时支付按钮不可用或提示“请填写完整且有效的卡信息”。
    - 支付失败时提示“支付失败，请稍后重试”。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingStep4
  description: 完成页（出票成功），展示订单摘要并创建订单（幂等）。
  properties:
    - name: bookingDraftId
      type: string
      description: "订票草稿 ID。"
  state:
    - order
    - isCreating
    - createError
  dependencies:
    - API-POST-Booking-Complete
    - UI-BookingProgressHeader
    - UI-BookingOrderSummaryCard
  acceptanceCriteria:
    - 正常创建订单后展示订单号/状态/下单时间/总金额与“成功出票”。
    - 重复触发时不重复创建，仍展示完成信息。
    - 创建失败时提示“订单创建失败，稍后查看订单中心”但不影响完成 UI。
    - 点击“返回首页”后跳转至首页。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"
    - date: "2026-01-17"
      description: "补充返回首页行为验收。"

- type: Frontend
  id: UI-BookingProgressHeader
  description: 全局购票进度条（Header），在 /booking/* 路由展示。
  properties:
    - name: bookingStage
      type: number
      description: "1-4 阶段值。"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 高亮当前阶段，已完成阶段显示“✓”。
    - 当阶段信息缺失或非法时默认回退为第 1 阶段展示。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-HomeFlightSearchCard
  description: 首页机票搜索卡片，填写出发地/目的地/出发日期并跳转结果页。
  properties:
    - name: onSearch
      type: function
      description: "点击搜索后的回调（负责路由跳转到结果页并携带查询参数）。"
  state:
    - from
    - to
    - departDate
    - fieldErrors
  dependencies:
    - UI-FlightsListPage
  acceptanceCriteria:
    - 当搜索条件完整且合法时点击“搜索”应进入搜索结果页并携带查询参数。
    - 当出发日期为过去日期时应阻止提交并提示“不可选择过去日期”。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-FlightsFilterBar
  description: 搜索结果页快捷筛选区，提供航空公司/起降时间/机型/舱位/更多筛选。
  properties:
    - name: filters
      type: object
      description: "当前筛选条件集合。"
    - name: onChange
      type: function
      description: "筛选条件变更回调。"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 变更任一筛选条件应触发 onChange 并更新列表查询。
    - 筛选条件应可序列化到 URL 查询参数以支持刷新/分享保留状态。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-FlightCard
  description: 航班卡片，展示航司、航班号、起降时间/机场/航站楼与最低价，并提供订票入口。
  properties:
    - name: flight
      type: object
      description: "航班摘要信息。"
    - name: onTogglePackages
      type: function
      description: "展开/收起套餐面板回调。"
  state:
    - isExpanded
  dependencies:
    - UI-FlightPackagePanel
  acceptanceCriteria:
    - 卡片应展示航空公司名称、航班号、起飞/到达时间与最低价。
    - 点击“订票”应展开或收起套餐面板。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-FlightPackagePanel
  description: 航班套餐面板，展示套餐名称、价格、退改政策、行李额与预订按钮。
  properties:
    - name: flightId
      type: string
      description: "航班 ID。"
    - name: departDate
      type: string
      description: "出发日期。"
    - name: onBook
      type: function
      description: "点击预订回调（创建草稿并跳转订票流程）。"
  state:
    - packages
    - priceVersion
    - isLoading
    - error
  dependencies:
    - API-GET-Flights-Packages
    - API-POST-Booking-Draft
  acceptanceCriteria:
    - 正常加载时展示套餐名称、价格、退改政策与行李额。
    - 套餐信息异常时提示“套餐信息异常，请重试”并禁止预订。
    - 当价格变动需要确认时应提示用户确认后再继续预订。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingPassengerForm
  description: 乘机人信息表单，填写姓名、证件类型/号码、国家/地区码与乘机人手机（选填）。
  properties:
    - name: value
      type: object
      description: "乘机人信息值。"
    - name: onChange
      type: function
      description: "表单变更回调。"
  state:
    - fieldErrors
  dependencies:
    - none
  acceptanceCriteria:
    - 当证件类型为身份证且证件号格式不合法时提示“证件号码格式不正确”。
    - 乘机人姓名不能为空。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingContactForm
  description: 联系人信息表单，选择国家/地区码并填写联系人手机号。
  properties:
    - name: value
      type: object
      description: "联系人信息值。"
    - name: onChange
      type: function
      description: "表单变更回调。"
  state:
    - fieldErrors
  dependencies:
    - none
  acceptanceCriteria:
    - 当联系人手机号非法时提示“联系人手机号格式不正确”。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingServicesList
  description: 增值服务选项列表，支持勾选服务并展示可用/不可用状态。
  properties:
    - name: services
      type: array
      description: "服务选项列表。"
    - name: selectedServiceIds
      type: array
      description: "已选择的服务 ID 列表。"
    - name: onChange
      type: function
      description: "选择变更回调。"
  state:
    - toastError
  dependencies:
    - none
  acceptanceCriteria:
    - 当服务不可用时提示“服务暂不可用”并自动取消勾选。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-PaymentCountdownTimer
  description: 支付倒计时组件，展示剩余时间并在到期时触发超时处理。
  properties:
    - name: expiresAt
      type: string
      description: "过期时间戳/时间字符串。"
    - name: onExpire
      type: function
      description: "倒计时到期回调。"
  state:
    - secondsLeft
  dependencies:
    - none
  acceptanceCriteria:
    - 倒计时归零时应触发 onExpire，并提示“超出时间，请重新开始订单”。
  changeLog:
    - date: "2026-01-17"
      description: "初始创建。"

- type: Frontend
  id: UI-PaymentMethodSelector
  description: 支付方式选择组件，支持已保存银行卡与新卡支付。
  properties:
    - name: value
      type: string
      description: "saved_card | new_card"
    - name: onChange
      type: function
      description: "支付方式变更回调。"
  state:
    - newCardForm
    - fieldErrors
  dependencies:
    - none
  acceptanceCriteria:
    - 当选择新卡支付时展示卡号/姓名/有效期/CVV 输入区。
    - 当新卡信息不完整或格式错误时应给出字段级提示并阻止支付。
