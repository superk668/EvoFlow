- type: Frontend
  id: UI-AuthSessionPersistence
  description: 登录态持久化与回跳能力（localStorage 与 sessionStorage 约定）。
  properties:
    - name: onLoginSuccess
      type: function
      description: "登录成功后的统一处理（保存登录态、处理回跳）。"
    - name: onLogout
      type: function
      description: "退出登录后的统一处理（清理登录态、回到入口页）。"
  state:
    - evoflow_auth
    - postLoginRedirect
  dependencies:
    - API-GET-AuthMe
  acceptanceCriteria:
    - localStorage 使用键名 evoflow_auth 保存 isLoggedIn、loginAt、userDisplayName、phoneNumber、token。
    - 未登录访问受限页面时写入 sessionStorage.postLoginRedirect 并跳转 /login。
    - 登录成功后若存在 postLoginRedirect 则回跳并清理该键。
    - 退出登录时清理 evoflow_auth 与用户相关缓存并回到未登录入口页。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-LoginPage
  description: 登录页面，支持账号密码登录与短信验证码登录切换。
  properties:
    - name: defaultTab
      type: string
      description: "默认登录方式：password 或 sms。"
  state:
    - activeTab
    - account
    - password
    - phoneNumber
    - verificationCode
    - agreePolicy
    - isSendingCode
    - countdownSeconds
    - error
    - isLoading
  dependencies:
    - API-POST-AuthLoginPassword
    - API-POST-AuthLoginSmsSend
    - API-POST-AuthLoginSms
    - UI-AuthSessionPersistence
  acceptanceCriteria:
    - 页面包含账号密码登录与验证码登录两个 Tab，默认展示账号密码登录。
    - 未勾选服务协议时点击登录应提示并阻止提交。
    - 账号密码登录失败时展示“用户名或密码不正确”。
    - 验证码登录发送验证码后按钮进入 60 秒倒计时且不可重复触发。
    - 验证码错误时展示“验证码不正确”，手机号未注册时展示“该手机号未注册，请先注册”。
    - 点击“免费注册”导航至 /register。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-RegisterStep1VerifyPhone
  description: 注册步骤1页面，输入手机号与验证码并进入设置密码步骤2。
  properties:
    - name: onVerified
      type: function
      description: "手机号验证成功后的回调（进入步骤2）。"
  state:
    - phoneNumber
    - smsCode
    - agreePolicy
    - isSendingCode
    - countdownSeconds
    - error
    - isLoading
  dependencies:
    - API-POST-AuthRegisterSmsSend
    - API-POST-AuthRegisterVerifyPhone
  acceptanceCriteria:
    - 手机号不合法时提示“手机号格式不正确，请重新输入”。
    - 发送验证码后按钮进入 60 秒倒计时且不可重复触发。
    - 未勾选服务协议时点击下一步应提示“请阅读并同意服务协议”。
    - 验证码错误时在验证码输入框下方提示“验证码错误”。
    - 验证通过后进入 /register/set-password 并携带 registerToken。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-RegisterStep2SetPassword
  description: 注册步骤2页面，设置密码并完成注册。
  properties:
    - name: registerToken
      type: string
      description: "步骤1验证通过后获取的 registerToken。"
  state:
    - password
    - confirmPassword
    - passwordVisible
    - confirmPasswordVisible
    - passwordStrength
    - error
    - isLoading
  dependencies:
    - API-POST-AuthRegisterComplete
  acceptanceCriteria:
    - 密码不符合 8-20 位字母/数字/符号组合时提示“密码需为8-20位字母、数字和符号的组合”。
    - 两次密码不一致时提示“两次输入密码不一致”，完成按钮不可点。
    - 支持密码可视化切换。
    - 注册成功后跳转至 /login。
    - 点击返回上一步回到 /register。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-RegisterSuccessPage
  description: 注册成功展示页面。
  properties:
    - name: onGoLogin
      type: function
      description: "引导用户前往登录页。"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 页面展示注册成功状态与引导入口。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingProgressHeader
  description: 订票流程全局进度条（在 /buy-ticket/step1-4 或 /booking/* 展示）。
  properties:
    - name: currentStage
      type: string
      description: "当前阶段：passenger/services/payment/complete。"
  state:
    - bookingStage
  dependencies:
    - none
  acceptanceCriteria:
    - 阶段顺序固定为 1乘机信息、2增值服务、3支付、4完成。
    - 当前阶段高亮，已完成阶段展示 ✓。
    - 当 bookingStage 缺失或非法时默认回退为 passenger。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingDraftStorage
  description: 订票草稿的单一数据源与一致性约定（sessionStorage.bookingDraft）。
  properties:
    - name: onDraftUpdated
      type: function
      description: "草稿更新后的回调（用于刷新摘要与按钮状态）。"
  state:
    - bookingDraft
    - draftError
  dependencies:
    - API-GET-BookingDraft
    - API-PUT-BookingDraft
    - API-DELETE-BookingDraft
  acceptanceCriteria:
    - 会话键名固定为 sessionStorage.bookingDraft。
    - 草稿结构包含 flightId、packageId、departDate、priceVersion、passenger、contact、services、stage。
    - 除订票输入页外，展示证件号与手机号必须使用脱敏值。
    - 任一页面读取不到草稿时按“草稿缺失”处理并阻止流程继续。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-BuyTicketStep1PassengerContact
  description: 订票页面（乘机人与联系人信息），校验通过后写入 bookingDraft 并进入增值服务页。
  properties:
    - name: onNext
      type: function
      description: "点击下一步且校验通过后的导航回调。"
  state:
    - passengerName
    - passengerIdType
    - passengerIdNumber
    - passengerPhoneNumber
    - contactPhoneNumber
    - error
    - isLoading
  dependencies:
    - UI-BookingDraftStorage
    - API-PUT-BookingDraft
  acceptanceCriteria:
    - 点击下一步且校验通过后必须将 passenger/contact 写入 bookingDraft。
    - 当证件号格式错误时提示“证件号码格式不正确”并阻止进入下一步。
    - 当联系人手机号非法时提示“联系人手机号格式不正确”并阻止进入下一步。
    - 写入失败时提示“网络异常，请稍后重试”并保留已填写数据。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-BuyTicketStep2Services
  description: 增值服务页，展示航班摘要与乘机人/联系人摘要（脱敏），生成订单并进入支付。
  properties:
    - name: onCreateOrderSuccess
      type: function
      description: "订单创建成功后的导航回调（进入支付页）。"
  state:
    - selectedServices
    - priceBreakdown
    - error
    - isLoading
  dependencies:
    - UI-BookingDraftStorage
    - API-GET-BookingDraft
    - API-PUT-BookingDraft
    - API-POST-OrdersFlight
  acceptanceCriteria:
    - 页面乘机人/联系人摘要必须从 bookingDraft 读取并脱敏展示。
    - 点击下一步后创建订单并写入共享订单存储 evoflow_orders，状态为 pending_payment。
    - 订单 details.passenger/contact 必须由 bookingDraft 生成快照且脱敏后落盘。
    - 当草稿缺失或解析失败时提示“订单信息异常，请返回重新填写”，并禁止进入支付。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-BuyTicketStep3Payment
  description: 支付页，展示倒计时（15:00）与支付方式，校验信息一致后发起支付。
  properties:
    - name: orderId
      type: string
      description: "订单号（来自路由参数或会话 createdOrderId）。"
  state:
    - remainingSeconds
    - payMethod
    - newCardForm
    - error
    - isPaying
  dependencies:
    - UI-BookingDraftStorage
    - API-GET-OrderById
    - API-GET-BookingDraft
    - API-POST-OrderPay
  acceptanceCriteria:
    - 支持从 /booking/payment/:orderId 进入，orderId 必须与订单列表入口一致。
    - 倒计时为 15 分钟并基于订单 expiresAt 计算。
    - 展示乘机人姓名、证件类型与证件号脱敏值，来源为 bookingDraft 或订单 details 快照。
    - 当乘机人信息缺失或不一致时提示“乘机人信息异常，请返回重新填写”并禁止支付。
    - 倒计时到期弹窗提示“超出时间，请重新开始订单”，并提供返回首页入口。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-BuyTicketStep4Complete
  description: 完成页（出票成功），展示订单摘要并将订单状态更新为 pending_travel。
  properties:
    - name: orderId
      type: string
      description: "订单号（用于查询与更新状态）。"
  state:
    - order
    - error
    - isUpdating
  dependencies:
    - API-GET-OrderById
    - API-PATCH-OrderStatus
    - API-DELETE-BookingDraft
  acceptanceCriteria:
    - 页面展示金额、路线、起降信息、乘机人/联系人摘要与价格明细（保持现有 UI 架构）。
    - 乘机人/联系人摘要优先来自订单 details（已脱敏），不足时使用 bookingDraft 生成脱敏摘要。
    - 完成页副作用重复触发时应检测创建锁或已有 createdOrderId 并避免重复更新。
    - 订单更新失败时提示“订单更新失败，稍后查看订单中心”，不影响完成页 UI。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-OrdersPage
  description: 订单中心列表页，展示本地共享订单存储中的订单。
  properties:
    - name: initialFilter
      type: string
      description: "初始筛选：all/pending_payment/pending_travel。"
  state:
    - activeFilter
    - orders
    - error
    - isLoading
  dependencies:
    - API-GET-Orders
    - DB-GenerateOrderTxt
    - DB-GenerateOrdersTxt
    - API-PATCH-OrderStatus
  acceptanceCriteria:
    - 页面路由为 /user-center/orders，未登录访问时跳转 /login，登录后回跳。
    - 列表筛选使用 Query 参数承载：tab(all/pending_travel/pending_payment/pending_review)、productType(all/flight/train/hotel)、page(从1开始)。
    - 列表数据来源为共享订单存储 evoflow_orders，默认展示近一年。
    - 页面提示“可查看近一年订单”，并提供“下载历史所有订单”入口。
    - 支持标签：all/pending_travel/pending_payment/pending_review，且 pending_travel 与 pending_review 基于 departAt 动态归类。
    - 支持按 productType 筛选：all/flight/train/hotel。
    - 支持分页与越界页码回退（最后一页或第一页），页面不崩溃。
    - 加载中显示 Loading，且标签/筛选/分页按钮置灰或展示忙碌态。
    - 加载需防抖 200ms、去重、取消前序请求结果，且同一时刻仅允许 1 个在途加载任务。
    - 加载超过 8 秒视为失败，提示“系统繁忙，请稍后重试”，保留当前筛选条件与已展示结果（如有）。
    - 本地读取失败或解析异常时提示“订单加载失败，请稍后重试”，并提供“重试”按钮。
    - 当无订单时展示“您还没有相关订单哦”，不显示订单卡片与分页控件。
    - 每条订单卡片至少展示：订单号、下单时间、订单状态、行程标题、出发日期、出行人、订单总金额。
    - 当订单状态为 pending_payment 时展示“去支付”入口，跳转 /booking/payment/:orderId。
    - 当订单状态为 pending_payment 或符合“未出行”定义时展示“取消订单”入口。
    - 点击“取消订单”需二次确认，取消成功提示“订单取消成功”，失败提示“取消失败”。
    - 支持“下载历史所有订单”入口与批量下载选中订单（文件格式 TXT）；生成失败提示“下载失败”。
    - 支持单条下载订单 TXT（文件格式 TXT）；生成失败提示“下载失败”。
    - 点击订单进入订单详情页。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "对齐订单管理列表页标签/筛选/分页/取消/下载与加载稳定性约定。"
    - date: "2026-01-19"
      description: "补充 Query 参数约定与历史订单下载入口。"

- type: Frontend
  id: UI-OrderDetailPage
  description: 订单详情页，展示订单状态、行程、乘机人/联系人摘要与价格明细。
  properties:
    - name: orderId
      type: string
      description: "订单号（来自路由参数）。"
  state:
    - order
    - error
    - isLoading
  dependencies:
    - API-GET-OrderById
    - API-PATCH-OrderStatus
    - DB-ValidateOrderPriceTotal
  acceptanceCriteria:
    - 乘机人/联系人摘要展示必须使用脱敏值并来自订单 details。
    - 页面路由为 /user-center/orders/:orderId。
    - 若 details 或其子字段缺失，对应区域展示“—”占位且页面不崩溃。
    - 订单不存在或不属于当前用户时提示“订单不存在或您没有权限查看”。
    - 本地读取失败或解析异常时提示“订单详情加载失败，请稍后重试”。
    - 待支付或未出行状态下展示“取消订单”，取消需二次确认并更新状态为 canceled。
    - 已取消状态隐藏取消按钮并展示“重新下单”。
    - 当价格明细求和不等于订单总额时提示“价格明细暂不可用，请稍后重试”，其余信息仍可查看。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "对齐订单详情页字段完整性、取消订单与价格明细一致性校验。"

- type: Frontend
