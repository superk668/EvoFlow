  dependencies:
    - DB-ReadBookingStage
  acceptanceCriteria:
    - 在 /booking/* 路由展示进度条，当前阶段高亮，已完成阶段显示“✓”。
    - bookingStage 缺失或非法时默认回退为第 1 阶段展示。
    - 会话读取失败时保持默认显示且不影响页面交互。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"
    - date: "2026-01-18"
      description: "修正依赖：从读取阶段（DB-ReadBookingStage）获取展示状态。"

- type: Frontend
