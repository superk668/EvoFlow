- type: Frontend
  id: UI-OrderManagementListPage
  description: 订单管理列表页，包含状态标签、类型筛选、订单列表与空状态。
  properties:
    - name: initialStatus
      type: string
      description: "初始展示的订单状态标签。"
  state:
    - selectedStatus
    - selectedType
    - page
    - pageSize
    - isLoading
    - error
    - orders
    - total
  dependencies:
    - API-GET-Orders
  acceptanceCriteria:
    - 用户登录后可通过顶部导航栏“我的订单”或个人中心左侧导航进入本页。
    - 点击“全部订单/未出行/待支付/已完成”等标签会刷新列表数据。
    - 订单类型下拉选择后列表仅显示对应类型订单。
    - 当无订单时显示“您还没有相关订单哦”的空状态提示。
    - 列表按创建时间倒序并支持分页展示。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-20"
      description: "补充列表页入口与验收标准。"

- type: Frontend
  id: UI-OrderCard
  description: 订单卡片组件，展示订单摘要并提供删除/去支付/跳转详情入口。
  properties:
    - name: order
      type: object
      description: "订单摘要数据。"
    - name: onDelete
      type: function
      description: "删除订单回调。"
    - name: onPay
      type: function
      description: "去支付回调。"
    - name: onOpenDetail
      type: function
      description: "打开详情回调。"
  state:
    - none
  dependencies:
    - API-DELETE-Order
  acceptanceCriteria:
    - 卡片展示订单号、预订日期、标题、出行时间、金额、出行人、状态。
    - 未支付订单显示“去支付”按钮。
    - 点击卡片文字区域可进入详情页。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-OrderDetailPage
  description: 订单详情页，展示状态横幅、订单详情信息与操作区。
  properties:
    - name: orderId
      type: string
      description: "路由参数中的订单ID。"
  state:
    - isLoading
    - error
    - orderDetail
    - isCancelConfirmOpen
  dependencies:
    - API-GET-OrderDetail
    - API-POST-OrderCancel
  acceptanceCriteria:
    - 详情页展示订单状态、旅客信息、价格明细等信息。
    - 顶部状态横幅支持“支付成功”与“已取消”两种展示，已取消态包含“重新下单/再次预订”入口。
    - 待出行订单可触发“取消订单”并弹出二次确认，确认后刷新为已取消状态。
    - 待支付订单显示“去支付”按钮并可跳转支付页面。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-20"
      description: "补充状态横幅与取消后刷新等验收标准。"

- type: Frontend
  id: UI-TopHeaderUserMenu
  description: 顶部栏用户头像/昵称区域与下拉菜单入口（用于进入个人信息与常用信息）。
  properties:
    - name: onOpenPersonalInfo
      type: function
      description: "跳转个人信息页回调。"
    - name: onOpenCommonInfo
      type: function
      description: "跳转常用信息页回调。"
  state:
    - isMenuOpen
    - profile
  dependencies:
    - API-GET-UserProfile
  acceptanceCriteria:
    - 未展开时显示用户头像与昵称。
    - 点击头像或昵称可进入个人信息页面。
    - 下拉菜单包含“个人信息/常用信息”入口。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-PersonalInfoPage
  description: 个人信息设置页，展示手机号、邮箱、昵称、姓名、性别、生日，并提供编辑入口。
  properties:
    - name: none
      type: none
      description: "无外部 props。"
  state:
    - isLoading
    - error
    - profile
  dependencies:
    - API-GET-UserProfile
  acceptanceCriteria:
    - 展示手机号、邮箱、昵称、姓名、性别、生日。
    - 点击“编辑”进入个人信息编辑页。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-PersonalInfoEditPage
  description: 个人信息编辑页，允许编辑昵称、姓名、性别、生日并提交保存。
  properties:
    - name: onSaveSuccess
      type: function
      description: "保存成功回调（用于回填页面展示）。"
  state:
    - isSaving
    - error
    - form
    - validationErrors
  dependencies:
    - API-GET-UserProfile
    - API-PUT-UserProfile
  acceptanceCriteria:
    - 昵称、姓名、性别必填；生日选填。
    - 保存成功后提示“个人信息已更新”。
    - 保存成功后无需刷新即可展示最新信息。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-CommonTravelerInfoListPage
  description: 常用旅客信息管理页，支持查询、新增、复选框批量删除。
  properties:
    - name: none
      type: none
      description: "无外部 props。"
  state:
    - isLoading
    - error
    - keyword
    - items
    - selectedIds
    - isDeleteConfirmOpen
  dependencies:
    - API-GET-Travelers
    - API-DELETE-Travelers
  acceptanceCriteria:
    - 输入关键字可筛选旅客列表。
    - 点击“新增”进入旅客信息编辑页。
    - 复选框支持批量选择并删除，删除前二次确认。
    - 删除成功提示“常用旅客信息已删除”。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-CommonTravelerInfoEditPage
  description: 常用旅客信息编辑页，支持新增/编辑旅客信息并保存。
  properties:
    - name: mode
      type: string
      description: "create 或 edit。"
    - name: travelerId
      type: string
      description: "编辑模式下的旅客ID。"
  state:
    - isSaving
    - error
    - form
    - validationErrors
  dependencies:
    - API-POST-Travelers
    - API-PUT-Traveler
  acceptanceCriteria:
    - 必填：中文名、证件类型（默认身份证）、证件号。
    - 保存成功提示“常用旅客信息已更新”并返回列表页。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Frontend
  id: UI-FlightSearchResultsPage
  description: 航班搜索结果页（单程），支持查询参数续航、筛选/排序、展开套餐并进入预订。
  properties:
    - name: initialQuery
      type: object
      description: "来自 URL 的查询参数（from/to/departDate 等）。"
  state:
    - query
    - filters
    - sort
    - page
    - pageSize
    - isLoading
    - error
    - flights
    - expandedFlightId
    - requestToken
  dependencies:
    - API-GET-Flights
    - API-POST-BookingDraft
  acceptanceCriteria:
    - 刷新或分享含查询参数的 URL 时保留筛选状态并重新加载列表。
    - 查询触发需做防抖 300ms，且新请求开始时取消/忽略旧请求结果。
    - 相同查询条件短时间内重复触发应去重。
    - 加载中筛选/排序/分页按钮应置灰或展示忙碌态。
    - 当 departDate 为过去日期时提示“不可选择过去日期”并阻止加载。
    - 点击套餐“预订”时创建 bookingDraft（flightId/packageId/departDate/priceVersion）并进入订票流程。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingProgressHeader
  description: 购票进度条（Header），在预订流程页面展示 1-4 阶段进度。
  properties:
    - name: currentStage
      type: number
      description: "当前阶段（1-4）。"
  state:
    - stage
  dependencies:
    - API-GET-BookingDraft
  acceptanceCriteria:
    - 阶段包含：1乘机信息、2增值服务、3支付、4完成。
    - 当前阶段高亮，已完成阶段显示完成态。
    - 当 stage 缺失或非法时默认回退为第 1 阶段展示。
    - 会话读取失败时不影响页面其余交互。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingFormPage
  description: 订票页（乘机人与联系人信息），支持选择常用旅客、校验并进入增值服务页。
  properties:
    - name: none
      type: none
      description: "无外部 props。"
  state:
    - passengers
    - contact
    - validationErrors
    - isSaving
    - error
    - selectedTravelerIds
  dependencies:
    - API-GET-BookingDraft
    - API-GET-Travelers
    - API-PUT-BookingTravelers
  acceptanceCriteria:
    - 乘机人姓名必填，证件号按证件类型校验（身份证不合法时提示“证件号码格式不正确”）。
    - 联系人手机号需合法；不合法时阻止进入下一步。
    - 点击“下一步”保存乘机人与联系人信息到会话并进入增值服务页。
    - 可从常用旅客信息中勾选并自动填充到输入框。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingServicesPage
  description: 增值服务页，允许选择/不选服务，生成订单并进入支付。
  properties:
    - name: none
      type: none
      description: "无外部 props。"
  state:
    - services
    - selectedServices
    - priceBreakdown
    - isSubmitting
    - error
  dependencies:
    - API-GET-BookingDraft
    - API-PUT-BookingServices
    - API-POST-Orders
  acceptanceCriteria:
    - 服务列表加载失败时展示占位但仍允许继续至支付。
    - 点击“下一步”时创建订单写入共享订单存储，productType=flight，status=pending_payment。
    - 订单创建成功后跳转至支付页并携带 orderId。
    - 已选服务计入价格清单。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingPaymentPage
  description: 支付页，展示金额摘要、航班信息、15分钟倒计时与支付方式选择。
  properties:
    - name: orderId
      type: string
      description: "路由参数中的订单ID。"
  state:
    - remainSeconds
    - selectedPayMethod
    - isPaying
    - error
    - isTimeoutModalOpen
    - order
  dependencies:
    - API-GET-OrderDetail
  acceptanceCriteria:
    - 进入页面默认倒计时为 15:00 并每秒更新展示。
    - 倒计时归零时弹窗提示“超出时间，请重新开始订单”，并提供“返回首页”入口。
    - 可选择已保存银行卡或新卡，支付按钮文案随选择变化。
    - 点击支付且未超时进入完成页。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Frontend
  id: UI-BookingCompletePage
  description: 完成页（出票成功），展示订单摘要并将订单状态更新为 pending_travel。
  properties:
    - name: orderId
      type: string
      description: "可选：用于定位订单的ID（无则使用最近订单或会话）。"
  state:
    - isUpdating
    - updateError
    - order
    - createdOrderId
  dependencies:
    - API-GET-OrderDetail
    - API-PATCH-OrderStatus
  acceptanceCriteria:
    - 页面展示“成功出票/支付完成”与订单信息卡（金额、路线、起降信息、乘机人摘要、联系人、价格明细）。
    - 页面副作用可能触发两次时应避免重复更新（幂等/锁）。
    - 状态更新成功后订单状态为 pending_travel。
    - 当订单更新失败时仍展示完成信息，并提示“订单更新失败，稍后查看订单中心”。
    - 提供“返回首页”入口。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"
