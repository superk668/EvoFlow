- type: Frontend
  id: UI-PersonalMyInfo
  description: 我的信息页（只读与编辑态切换），本地持久化为主并支持后端同步兜底。
  properties:
    - name: onSaved
      type: function
      description: "保存成功后的回调（回到只读态或提示已保存）。"
  state:
    - profile
    - isEditing
    - form
    - error
    - isSaving
    - syncToast
  dependencies:
    - DB-ReadUserProfileStorage
    - DB-UpsertUserProfile
    - API-POST-UserCenterMyInfo
  acceptanceCriteria:
    - 页面路由为 /user-center/my-info，未登录访问时跳转 /login。
    - 手机号展示必须按前三后四脱敏规则。
    - 只读态展示：手机(脱敏)+“修改”(占位)、邮箱状态+“验证”(占位)、昵称/姓名/性别/生日当前值或“未设置”。
    - 编辑态展示：昵称/姓名必填输入框、性别单选（男/女）、生日输入框（占位 yyyy-MM-dd）与“保存”按钮。
    - 点击标题栏“收起”应切换回只读态。
    - 点击保存后必须先完成本地写入成功才允许提示成功并更新只读态。
    - 当后端同步失败但本地已保存时提示“已保存，本次同步失败，请稍后重试”，不得回滚本地数据。
    - 昵称为空或超过 20 字符时提示“请输入昵称（不超过20字符）”并阻止保存。
    - 姓名为空或包含数字/特殊字符时提示“请输入合法姓名”并阻止保存。
    - 性别必须选择男或女，否则阻止保存。
    - 生日非空且格式错误时提示“日期格式应为 yyyy-MM-dd”并阻止保存。
    - 生日非空且为未来日期时提示“日期格式应为 yyyy-MM-dd，且不得为未来日期”并阻止保存。
    - 当 nicknameStatus=reviewing 时，昵称输入框置灰不可编辑并展示“审核中”，尝试进入编辑时提示“昵称审核中，暂不可修改”，且允许修改其他字段。
