- type: Database
  id: DB-ListOrdersByUser
  description: 按用户查询订单列表，支持状态/类型筛选与分页，按创建时间倒序。
  dependencies:
    - none
  acceptanceCriteria:
    - 仅返回属于当前用户的订单记录。
    - 支持按状态筛选：all、upcoming(待出行)、pending_payment(待支付)、completed(已完成)、canceled(已取消)。
    - 状态规则：pending_payment 表示下单未支付；upcoming 表示已支付且当前时间早于 departureAt；completed 表示已支付且当前时间晚于 arrivalAt；canceled 表示用户取消或超时系统自动取消。
    - 支持按类型筛选：all、flight、train、hotel。
    - 返回结果按 createdAt 倒序。
    - 支持分页参数 page 与 pageSize。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-20"
      description: "补充订单状态定义与时间判定规则。"

- type: Database
  id: DB-GetOrderByIdForUser
  description: 按订单ID获取订单详情，并校验订单归属当前用户。
  dependencies:
    - none
  acceptanceCriteria:
    - 当订单存在且归属当前用户时，返回完整订单详情。
    - 当订单不存在时返回 not found。
    - 当订单不归属当前用户时返回 forbidden。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-CancelOrderForUser
  description: 将指定订单更新为已取消，并记录取消时间。
  dependencies:
    - DB-GetOrderByIdForUser
  acceptanceCriteria:
    - 仅允许取消属于当前用户的订单。
    - 取消成功后订单状态更新为 canceled，并写入 canceledAt。
    - 若订单已取消，重复取消应保持幂等。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-SoftDeleteOrderForUser
  description: 软删除指定订单，确保列表页不再返回该订单。
  dependencies:
    - DB-GetOrderByIdForUser
  acceptanceCriteria:
    - 仅允许删除属于当前用户的订单。
    - 删除成功后设置 deletedAt 或 isDeleted 标记。
    - 被软删除的订单在 DB-ListOrdersByUser 结果中不可见。
    - 重复删除应保持幂等。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-GetUserProfile
  description: 获取当前用户的个人信息档案。
  dependencies:
    - none
  acceptanceCriteria:
    - 当用户存在时返回手机号、邮箱、昵称、姓名、性别、生日等字段。
    - 手机号与邮箱为不可编辑字段，仍需可读取。
    - 当用户不存在时返回 not found。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-UpdateUserProfile
  description: 更新当前用户的个人信息档案（仅允许更新可编辑字段）。
  dependencies:
    - DB-GetUserProfile
  acceptanceCriteria:
    - 仅允许更新昵称、姓名、性别、生日。
    - 昵称、姓名、性别为必填；生日为选填。
    - 更新成功后读取到的数据应为最新。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-ListTravelerProfiles
  description: 查询当前用户的常用旅客信息列表，支持按姓名或手机号关键字过滤。
  dependencies:
    - none
  acceptanceCriteria:
    - 仅返回属于当前用户的旅客信息。
    - 当提供 keyword 时，按中文名/英文名/手机号进行包含匹配。
    - 当无记录时返回空列表。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-CreateTravelerProfile
  description: 为当前用户新增一条常用旅客信息。
  dependencies:
    - DB-ListTravelerProfiles
  acceptanceCriteria:
    - 必填：中文名、证件类型（默认身份证）、证件号。
    - 选填：英文名、手机/电话、国籍(国家/地区)、性别、生日、常旅客卡等。
    - 创建成功后列表查询可见。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-UpdateTravelerProfile
  description: 更新当前用户指定旅客ID的常用旅客信息。
  dependencies:
    - DB-ListTravelerProfiles
  acceptanceCriteria:
    - 仅允许更新属于当前用户的旅客记录。
    - 必填字段缺失或不合法时操作应失败。
    - 更新成功后列表查询可见最新值。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-DeleteTravelerProfiles
  description: 批量删除当前用户的常用旅客信息（按ID列表）。
  dependencies:
    - DB-ListTravelerProfiles
  acceptanceCriteria:
    - 仅删除属于当前用户的旅客记录。
    - 支持批量删除；对不存在的ID应忽略并保持幂等。
    - 删除成功后列表查询不再返回被删除的记录。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-QueryFlights
  description: 从本地模拟航班数据集中按查询条件返回可售航班与套餐信息。
  dependencies:
    - none
  acceptanceCriteria:
    - 支持按 from/to/departDate 查询并返回匹配航班列表。
    - 支持按 airline、起降时间段、机场等筛选参数（若提供）。
    - 支持按起飞时间或价格排序（若提供）。
    - 当无可售结果时返回空列表。
    - 数据加载失败或解析异常时返回 error。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Database
  id: DB-SaveBookingSession
  description: 写入机票预订流程会话数据到 sessionStorage（草稿/阶段/乘机人与联系人/增值服务等）。
  dependencies:
    - none
  acceptanceCriteria:
    - 支持保存 bookingDraft（flightId、packageId、departDate、priceVersion）。
    - 支持保存 bookingStage（1-4）。
    - 支持保存 passengers 与 contact 信息。
    - 支持保存 selectedServices 与价格清单。
    - 写入失败时返回 error，但不应导致页面崩溃。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Database
  id: DB-LoadBookingSession
  description: 从 sessionStorage 读取机票预订流程会话数据。
  dependencies:
    - none
  acceptanceCriteria:
    - 当数据存在且可解析时返回完整会话对象。
    - 当数据缺失时返回空对象并允许流程回退到默认阶段。
    - 当解析失败时返回 error，并返回空对象作为降级。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Database
  id: DB-CreateSharedOrder
  description: 在本地共享订单存储（localStorage 的 evoflow_orders）中创建一条机票订单，初始状态为 pending_payment。
  dependencies:
    - none
  acceptanceCriteria:
    - 必填字段：orderId、productType、status、createdAt、departAt、totalAmount。
    - productType 固定为 flight；status 初始为 pending_payment。
    - 创建成功后，订单可被列表与详情读取。
    - 当 localStorage 写入失败时返回 error。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Database
  id: DB-GetSharedOrderById
  description: 从本地共享订单存储中按 orderId 读取订单详情。
  dependencies:
    - none
  acceptanceCriteria:
    - 当订单存在时返回订单详情。
    - 当订单不存在时返回 not found。
    - 当 localStorage 读取或解析失败时返回 error。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"

- type: Database
  id: DB-UpdateSharedOrderStatus
  description: 更新本地共享订单存储中指定订单的状态与关键字段（用于支付完成后进入待出行）。
  dependencies:
    - DB-GetSharedOrderById
  acceptanceCriteria:
    - 支持将订单状态从 pending_payment 更新为 pending_travel。
    - 更新时应保持幂等：若已为目标状态，重复更新不应报错。
    - 更新成功后，订单列表与详情读取应反映最新状态。
    - 写入失败时返回 error，并允许 UI 继续展示完成态。
  changeLog:
    - date: "2026-01-20"
      description: "初始创建。"
