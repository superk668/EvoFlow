- type: Database
  id: DB-FindUserByAccount
  description: 根据账号标识查询用户（手机号/邮箱/用户名）。
  dependencies:
    - none
  acceptanceCriteria:
    - 当账号存在时返回唯一用户记录（包含 userId、userDisplayName、phoneNumber、passwordHash）。
    - 当账号不存在时返回空结果。
    - 账号匹配规则支持手机号/邮箱/用户名其一命中。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-FindUserByPhone
  description: 根据手机号查询用户。
  dependencies:
    - none
  acceptanceCriteria:
    - 当手机号存在时返回唯一用户记录。
    - 当手机号不存在时返回空结果。
    - users.phoneNumber 字段具备唯一性约束。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-CreateUser
  description: 创建用户记录并写入密码哈希。
  dependencies:
    - DB-FindUserByPhone
  acceptanceCriteria:
    - 成功执行后 users 表新增一条记录，包含 userId、userDisplayName、phoneNumber、passwordHash、createdAt。
    - 当手机号已存在时操作失败并返回唯一性冲突。
    - passwordHash 不可逆保存，明文密码不落库。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-UpdateUserPassword
  description: 更新用户密码哈希。
  dependencies:
    - DB-FindUserByPhone
  acceptanceCriteria:
    - 仅当用户存在时更新 passwordHash。
    - 更新成功后 updatedAt 被刷新。
    - 明文密码不落库。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-StoreSmsCode
  description: 生成并保存短信验证码（按手机号与用途区分）。
  dependencies:
    - none
  acceptanceCriteria:
    - 保存字段至少包含 phoneNumber、purpose(login/register)、code、expiresAt、createdAt、usedAt(可空)。
    - 支持基于 phoneNumber+purpose 的 60 秒内限频校验所需数据。
    - code 以明文或可比对方式保存，以支持校验。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-VerifySmsCode
  description: 校验短信验证码有效性（用途、过期、是否已使用）。
  dependencies:
    - DB-StoreSmsCode
  acceptanceCriteria:
    - 当 code 匹配且未过期且未被使用时返回校验通过。
    - 当 code 不匹配或已过期或已使用时返回校验失败。
    - 校验用途必须匹配（login/register）。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-MarkSmsCodeUsed
  description: 将短信验证码标记为已使用。
  dependencies:
    - DB-VerifySmsCode
  acceptanceCriteria:
    - 当验证码校验通过后可写入 usedAt 时间。
    - 重复标记不应导致系统异常。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-CreateAuthSession
  description: 创建登录会话并发放 token。
  dependencies:
    - DB-FindUserByAccount
  acceptanceCriteria:
    - 成功后生成 token（JWT 或不透明 token）并与 userId 关联。
    - token 具备过期策略并可被吊销。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-RevokeAuthSession
  description: 吊销登录会话 token。
  dependencies:
    - DB-CreateAuthSession
  acceptanceCriteria:
    - 吊销后 token 不再可用于鉴权。
    - 多次吊销同一 token 返回幂等成功。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-LoadMockFlights
  description: 加载本地模拟航班数据，供搜索结果页渲染。
  dependencies:
    - none
  acceptanceCriteria:
    - 返回可用于渲染的航班列表，每条至少包含 flightId、airlineName、flightNo、depTime、arrTime、depAirport、arrAirport、price。
    - 读取失败或解析异常时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-CreateBookingDraft
  description: 创建并写入预订草稿到会话存储（booking draft）。
  dependencies:
    - none
  acceptanceCriteria:
    - 草稿写入到 sessionStorage 并可在页面刷新后恢复。
    - 使用键名 sessionStorage.bookingDraft 保存草稿 JSON。
    - 草稿至少包含 flightId、packageId、departDate、priceVersion。
    - 写入失败时返回明确错误，且不应清空用户已选择的信息。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"
    - date: "2026-01-18"
      description: "补充草稿键名约定（bookingDraft）。"

- type: Database
  id: DB-ReadBookingDraft
  description: 从会话存储读取预订草稿（booking draft）。
  dependencies:
    - none
  acceptanceCriteria:
    - 从 sessionStorage.bookingDraft 读取并解析草稿 JSON。
    - 当草稿不存在时返回空结果。
    - 解析异常时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-UpdateBookingDraftPassengerContact
  description: 更新预订草稿中的乘机人与联系人信息。
  dependencies:
    - DB-CreateBookingDraft
  acceptanceCriteria:
    - 成功写入 passenger 与 contact 字段（姓名、证件类型、证件号、联系人手机号等）。
    - 写入失败时返回明确错误并保留当前输入。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-UpdateBookingDraftServices
  description: 更新预订草稿中的已选增值服务与价格清单。
  dependencies:
    - DB-CreateBookingDraft
  acceptanceCriteria:
    - 支持写入服务选择结果与对应的价格明细。
    - 服务不可用时应能标记为不可选并保持一致状态。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-WriteBookingStage
  description: 写入购票进度阶段到会话存储（bookingStage）。
  dependencies:
    - none
  acceptanceCriteria:
    - 写入 sessionStorage.bookingStage，值为 1-4 的数字或等价可解析值。
    - 当会话写入失败时返回明确错误且不影响页面继续浏览。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-ReadBookingStage
  description: 从会话存储读取购票进度阶段（bookingStage）。
  dependencies:
    - none
  acceptanceCriteria:
    - 从 sessionStorage.bookingStage 读取阶段值并解析为 1-4。
    - 当阶段缺失或非法时返回空结果或默认值指示。
    - 读取异常时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-ReadEvoflowOrders
  description: 从 localStorage 读取共享订单存储 evoflow_orders。
  dependencies:
    - none
  acceptanceCriteria:
    - 读取并解析 localStorage.evoflow_orders 为 JSON 数组。
    - 读取失败或解析异常时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-WriteEvoflowOrders
  description: 将订单数组写入 localStorage 的 evoflow_orders。
  dependencies:
    - DB-ReadEvoflowOrders
  acceptanceCriteria:
    - 写入成功后可被订单中心读取并展示。
    - 写入失败时返回明确错误且不应破坏原有订单数据。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-CreateOrder
  description: 创建订单并写入共享订单存储（productType=flight, status=pending_payment）。
  dependencies:
    - DB-ReadEvoflowOrders
    - DB-WriteEvoflowOrders
  acceptanceCriteria:
    - 创建的订单至少包含 orderId、productType、status、createdAt、departAt、totalAmount。
    - 创建成功后订单中心可读取到该订单。
    - 写入失败时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-UpdateOrderStatus
  description: 更新共享订单存储中的订单状态（例如 pending_payment -> pending_travel）。
  dependencies:
    - DB-ReadEvoflowOrders
    - DB-WriteEvoflowOrders
  acceptanceCriteria:
    - 根据 orderId 定位订单并更新 status 与必要的时间字段。
    - 支持将订单状态更新为 canceled，并写入 canceledAt 与 updatedAt。
    - 当 orderId 不存在时返回明确错误。
    - 写入失败时返回明确错误且不应破坏原有订单数据。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

    - date: "2026-01-18"
      description: "补充状态 canceled 以及取消时间字段约定。"

- type: Database
  id: DB-FindOrderById
  description: 从共享订单存储中按 orderId 查找单个订单。
  dependencies:
    - DB-ReadEvoflowOrders
  acceptanceCriteria:
    - 当 orderId 存在时返回唯一订单记录。
    - 当 orderId 不存在时返回空结果。
    - 读取或解析失败时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-CancelOrder
  description: 取消订单并写入共享订单存储（将状态置为 canceled）。
  dependencies:
    - DB-FindOrderById
    - DB-UpdateOrderStatus
  acceptanceCriteria:
    - 仅允许取消 status 为 pending_payment 或 pending_travel 的订单。
    - 取消成功后订单 status 变为 canceled，并写入 canceledAt 与 updatedAt。
    - 重复取消同一订单返回幂等成功并保持 canceled 状态。
    - 当订单不存在时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-ReadCommonTravelers
  description: 从 localStorage 读取常用旅客信息列表（evoflow_common_travelers）。
  dependencies:
    - none
  acceptanceCriteria:
    - 读取并解析 localStorage.evoflow_common_travelers 为 JSON 数组。
    - 当键不存在时返回空数组。
    - 解析异常时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-WriteCommonTravelers
  description: 将常用旅客信息列表写入 localStorage（evoflow_common_travelers）。
  dependencies:
    - DB-ReadCommonTravelers
  acceptanceCriteria:
    - 写入成功后常用旅客列表页可读取并展示。
    - 写入失败时返回明确错误且不应破坏原有旅客数据。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-FindCommonTravelerById
  description: 按 travelerId 查找单个常用旅客记录。
  dependencies:
    - DB-ReadCommonTravelers
  acceptanceCriteria:
    - 当 travelerId 存在时返回唯一旅客记录。
    - 当 travelerId 不存在时返回空结果。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-CreateCommonTraveler
  description: 新增常用旅客记录并写入本地存储。
  dependencies:
    - DB-ReadCommonTravelers
    - DB-WriteCommonTravelers
  acceptanceCriteria:
    - 成功新增后返回 travelerId，并在列表页可见。
    - 记录字段至少包含 travelerId、isSelf、phoneNumber、idType、idNumber、nationality、gender。
    - 当 isSelf 为 true 时，存储中应确保仅存在一条 isSelf=true 的记录（其余自动置为 false）。
    - 写入失败时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-UpdateCommonTraveler
  description: 更新常用旅客记录并写入本地存储。
  dependencies:
    - DB-FindCommonTravelerById
    - DB-WriteCommonTravelers
  acceptanceCriteria:
    - 根据 travelerId 定位并更新旅客字段。
    - 当 isSelf 被更新为 true 时，确保仅存在一条 isSelf=true 的记录（其余自动置为 false）。
    - 当 travelerId 不存在时返回明确错误。
    - 写入失败时返回明确错误且不应破坏原有旅客数据。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-DeleteCommonTraveler
  description: 删除常用旅客记录并写入本地存储。
  dependencies:
    - DB-FindCommonTravelerById
    - DB-WriteCommonTravelers
  acceptanceCriteria:
    - 当目标旅客 isSelf=true 时，删除应失败并返回“本人信息不可删除”。
    - 当 travelerId 不存在时返回明确错误。
    - 删除成功后列表页不再展示该记录。
    - 写入失败时返回明确错误且保留原数据。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-ReadUserProfile
  description: 从 localStorage 读取用户个人信息（evoflow_user_profile）。
  dependencies:
    - none
  acceptanceCriteria:
    - 读取并解析 localStorage.evoflow_user_profile 为 JSON 对象。
    - 当键不存在时返回空结果。
    - 解析异常时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-UpdateUserProfile
  description: 更新用户个人信息并写入 localStorage（evoflow_user_profile）。
  dependencies:
    - DB-ReadUserProfile
  acceptanceCriteria:
    - 支持更新昵称、姓名、性别、生日、邮箱等字段，并写入 updatedAt。
    - 写入失败时返回明确错误且不应破坏原有个人信息。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-LoadUserCenterIndexModel
  description: 加载个人中心“常用信息索引页”入口模型（用于渲染四个入口）。
  dependencies:
    - none
  acceptanceCriteria:
    - 返回入口列表，至少包含常用旅客信息、常用联系人、常用报销凭证、常用地址。
    - 当加载失败或解析异常时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-SerializeOrdersForDownload
  description: 将订单数据序列化为可下载的文本内容（CSV 或 JSON）。
  dependencies:
    - DB-ReadEvoflowOrders
  acceptanceCriteria:
    - 支持将订单数组序列化为可下载内容，并包含 orderId、productType、status、createdAt、departAt、totalAmount。
    - 当数据读取或序列化失败时返回明确错误。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"
