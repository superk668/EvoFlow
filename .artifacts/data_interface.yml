- type: Database
  id: DB-FindUserByAccount
  description: 根据账号标识查询用户（手机号/邮箱/用户名）。
  dependencies:
    - none
  acceptanceCriteria:
    - 当账号存在时返回唯一用户记录（包含 userId、userDisplayName、phoneNumber、passwordHash）。
    - 当账号不存在时返回空结果。
    - 账号匹配规则支持手机号/邮箱/用户名其一命中。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-FindUserByPhone
  description: 根据手机号查询用户。
  dependencies:
    - none
  acceptanceCriteria:
    - 当手机号存在时返回唯一用户记录。
    - 当手机号不存在时返回空结果。
    - users.phoneNumber 字段具备唯一性约束。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-CreateUser
  description: 创建用户记录并写入密码哈希。
  dependencies:
    - DB-FindUserByPhone
  acceptanceCriteria:
    - 成功执行后 users 表新增一条记录，包含 userId、userDisplayName、phoneNumber、passwordHash、createdAt。
    - 当手机号已存在时操作失败并返回唯一性冲突。
    - passwordHash 不可逆保存，明文密码不落库。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-UpdateUserPassword
  description: 更新用户密码哈希。
  dependencies:
    - DB-FindUserByPhone
  acceptanceCriteria:
    - 仅当用户存在时更新 passwordHash。
    - 更新成功后 updatedAt 被刷新。
    - 明文密码不落库。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-StoreSmsCode
  description: 生成并保存短信验证码（按手机号与用途区分）。
  dependencies:
    - none
  acceptanceCriteria:
    - 保存字段至少包含 phoneNumber、purpose(login/register)、code、expiresAt、createdAt、usedAt(可空)。
    - 支持基于 phoneNumber+purpose 的 60 秒内限频校验所需数据。
    - code 以明文或可比对方式保存，以支持校验。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-VerifySmsCode
  description: 校验短信验证码有效性（用途、过期、是否已使用）。
  dependencies:
    - DB-StoreSmsCode
  acceptanceCriteria:
    - 当 code 匹配且未过期且未被使用时返回校验通过。
    - 当 code 不匹配或已过期或已使用时返回校验失败。
    - 校验用途必须匹配（login/register）。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-MarkSmsCodeUsed
  description: 将短信验证码标记为已使用。
  dependencies:
    - DB-VerifySmsCode
  acceptanceCriteria:
    - 当验证码校验通过后可写入 usedAt 时间。
    - 重复标记不应导致系统异常。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-CreateAuthSession
  description: 创建登录会话并发放 token。
  dependencies:
    - DB-FindUserByAccount
  acceptanceCriteria:
    - 成功后生成 token（JWT 或不透明 token）并与 userId 关联。
    - token 具备过期策略并可被吊销。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-RevokeAuthSession
  description: 吊销登录会话 token。
  dependencies:
    - DB-CreateAuthSession
  acceptanceCriteria:
    - 吊销后 token 不再可用于鉴权。
    - 多次吊销同一 token 返回幂等成功。
  changeLog:
    - date: "2026-01-18"
      description: "初始创建。"

- type: Database
  id: DB-GetBookingDraft
  description: 从会话存储读取订票草稿 bookingDraft。
  dependencies:
    - none
  acceptanceCriteria:
    - 读取 sessionStorage.bookingDraft 并解析为对象。
    - 关键字段至少包含 flightId、packageId、departDate、priceVersion。
    - 若不存在或解析失败则返回空结果与错误原因（not_found/parse_error）。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-UpsertBookingDraft
  description: 写入/更新会话存储中的订票草稿 bookingDraft。
  dependencies:
    - DB-GetBookingDraft
  acceptanceCriteria:
    - 写入键名固定为 sessionStorage.bookingDraft。
    - 仅允许更新既定字段：flightId、packageId、departDate、priceVersion、passenger、contact、services、stage。
    - 写入 passenger 字段包含 name、idType、idNumber、phoneNumber(可空)。
    - 写入 contact 字段包含 phoneNumber。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-DeleteBookingDraft
  description: 删除会话存储中的订票草稿 bookingDraft。
  dependencies:
    - DB-GetBookingDraft
  acceptanceCriteria:
    - 删除 sessionStorage.bookingDraft 键。
    - 多次删除返回幂等成功。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-CreateFlightOrder
  description: 在共享订单存储中创建机票订单（本地落盘 evoflow_orders）。
  dependencies:
    - DB-GetBookingDraft
  acceptanceCriteria:
    - 订单写入 localStorage.evoflow_orders（数组）。
    - 订单字段至少包含 orderId、productType=flight、status=pending_payment、createdAt、departAt、totalAmount、details。
    - 如存在支付倒计时，订单包含 expiresAt（用于计算 15 分钟倒计时）。
    - details 必须包含 route(fromCity/toCity)、passenger(name/idType/idNumberMasked)、contact(phoneNumber)、priceItems。
    - details.passenger 与 details.contact 必须由 bookingDraft.passenger/contact 生成快照，且证件号与手机号已脱敏后落盘。
    - 若写入失败返回错误原因（storage_error）。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "字段对齐订单中心（orderId/totalAmount/departAt/details 结构）。"

- type: Database
  id: DB-GetOrderById
  description: 根据订单号从共享订单存储读取订单。
  dependencies:
    - none
  acceptanceCriteria:
    - 从 localStorage.evoflow_orders 按 orderId 精确匹配返回订单。
    - 当订单不存在时返回空结果。
    - 读取失败或解析失败返回错误原因（parse_error/storage_error）。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "字段对齐订单中心（按 orderId 查询）。"

- type: Database
  id: DB-ListOrders
  description: 读取共享订单存储中的订单列表，支持筛选、分页与近一年展示。
  dependencies:
    - none
  acceptanceCriteria:
    - 默认返回按 createdAt 倒序。
    - 默认仅返回近一年订单（按 createdAt 过滤）。
    - 支持按 productType 过滤：flight/train/hotel。
    - 支持按 tab 过滤：all/pending_payment/pending_travel/pending_review。
    - pending_travel 与 pending_review 的归类必须基于 departAt 与当前时间动态判断。
    - 支持分页参数 page(从1开始) 与 pageSize，并对越界页码回退到最后一页或第一页。
    - 解析失败时返回空列表与错误原因（parse_error）。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "补充分页与按 tab/productType 过滤规则。"

- type: Database
  id: DB-UpdateOrderStatus
  description: 更新订单状态并持久化到共享订单存储。
  dependencies:
    - DB-GetOrderById
  acceptanceCriteria:
    - 支持状态从 pending_payment 更新为 pending_travel。
    - 支持取消订单：pending_payment 或 pending_travel(且 departAt > 当前时间) 更新为 canceled。
    - 当订单状态不允许取消时返回 forbidden。
    - 更新时刷新 updatedAt。
    - 当订单不存在时返回 not_found。
    - 同一状态重复更新返回幂等成功。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "补充取消订单（canceled）与可取消条件。"

- type: Database
  id: DB-GenerateOrderTxt
  description: 将订单快照生成用于下载的 TXT 文本内容。
  dependencies:
    - DB-GetOrderById
  acceptanceCriteria:
    - 生成内容至少包含：订单号、状态、下单时间、出发日期、行程(fromCity→toCity)、出行人、订单总金额。
    - 当 details 或其子字段缺失时，使用“—”占位且仍可生成文件。
    - 当订单不存在时返回 not_found。
    - 生成失败时返回 generate_error。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-GenerateOrdersTxt
  description: 生成多个订单的 TXT 文本内容（用于批量/历史订单下载）。
  dependencies:
    - DB-ListOrders
    - DB-GenerateOrderTxt
  acceptanceCriteria:
    - 支持按 orderIds 生成批量 TXT；当 orderIds 为空时生成近一年全部订单 TXT。
    - 输出内容按订单 createdAt 倒序排列，每个订单以固定分隔符分隔。
    - 当某条订单不存在或生成失败时，该条以“—”占位并继续生成其他订单，不导致整体失败。
    - 当订单列表读取/解析失败时返回 parse_error/storage_error。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-ValidateOrderPriceTotal
  description: 校验订单价格明细求和是否等于订单总金额。
  dependencies:
    - DB-GetOrderById
  acceptanceCriteria:
    - 当 details.priceItems 缺失或格式非法时返回 invalid_price_items。
    - priceItems 求和口径为 sum(unitPrice * quantity)，与 totalAmount 不一致时返回 mismatch。
    - 校验通过返回 ok。
    - 当订单不存在时返回 not_found。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-ReadCommonTravelersStorage
  description: 从本地持久化读取常用旅客列表（localStorage.evoflow_common_travelers）。
  dependencies:
    - none
  acceptanceCriteria:
    - 从 localStorage 键名 evoflow_common_travelers 读取 JSON 数组。
    - 当键不存在时返回空数组。
    - 解析失败时返回空数组与错误原因（parse_error）。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-WriteCommonTravelersStorage
  description: 将常用旅客列表写入本地持久化（localStorage.evoflow_common_travelers）。
  dependencies:
    - DB-ReadCommonTravelersStorage
  acceptanceCriteria:
    - 写入 localStorage 键名固定为 evoflow_common_travelers。
    - 写入失败返回错误原因（storage_error）。
    - 写入成功后可被下一次读取回读。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-ListCommonTravelers
  description: 列出常用旅客并支持按姓名关键字筛选。
  dependencies:
    - DB-ReadCommonTravelersStorage
  acceptanceCriteria:
    - 返回数据来源为 evoflow_common_travelers。
    - 支持按姓名关键字筛选（中文名或英文名任一包含）。
    - 当搜索关键字仅含特殊字符时返回输入异常（invalid_query）。
    - 对缺失 travelerId/isSelf/nameZh/lastName/firstName 的脏数据应忽略或标记为数据异常且不影响其他记录。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-GetCommonTravelerById
  description: 根据 travelerId 读取单个常用旅客记录。
  dependencies:
    - DB-ReadCommonTravelersStorage
  acceptanceCriteria:
    - travelerId 缺失或为空时返回 not_found。
    - 找到匹配 travelerId 时返回完整记录。
    - 未找到返回 not_found。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-CreateCommonTraveler
  description: 新增常用旅客记录并持久化，保证本人唯一与证件唯一。
  dependencies:
    - DB-ReadCommonTravelersStorage
    - DB-WriteCommonTravelersStorage
  acceptanceCriteria:
    - 新增时生成唯一 travelerId。
    - 中文名与英文名（lastName/firstName）两者至少填写一项。
    - 当 birthday 非空时必须满足 yyyy-MM-dd。
    - 当设置 isSelf=true 时，其他记录必须自动变更为 isSelf=false。
    - 当存在 idType 与 idNumber 时，集合内 idType+idNumber 必须唯一，否则返回 conflict。
    - 存在证件号时必须落盘 idNumberMasked（保留前三位与后两位，中间用 *）。
    - 写入成功后可回读且刷新页面不丢失。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-UpdateCommonTraveler
  description: 编辑常用旅客记录并持久化，保证本人唯一与证件唯一。
  dependencies:
    - DB-GetCommonTravelerById
    - DB-WriteCommonTravelersStorage
  acceptanceCriteria:
    - 当 travelerId 不存在时返回 not_found。
    - 保存时执行与新增相同的字段校验与约束（本人唯一、证件唯一、生日格式）。
    - 更新成功后刷新 updatedAt（如字段存在）。
    - 存在证件号时必须同步更新 idNumberMasked。
    - 写入失败返回 storage_error 并保留用户输入用于再次提交。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-DeleteCommonTraveler
  description: 删除常用旅客记录（本人不可删除）。
  dependencies:
    - DB-GetCommonTravelerById
    - DB-WriteCommonTravelersStorage
  acceptanceCriteria:
    - travelerId 不存在返回 not_found。
    - 当记录 isSelf=true 时返回 forbidden 并提示“本人信息不可删除”。
    - 删除成功后列表不再包含该记录。
    - 删除失败返回 storage_error 并保留当前选择状态。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-ReadUserProfileStorage
  description: 从本地持久化读取个人信息（localStorage.evoflow_user_profile）。
  dependencies:
    - none
  acceptanceCriteria:
    - 从 localStorage 键名 evoflow_user_profile 读取 JSON 对象。
    - 当键不存在时返回空对象。
    - 解析失败时返回空对象与错误原因（parse_error）。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-WriteUserProfileStorage
  description: 将个人信息写入本地持久化（localStorage.evoflow_user_profile）。
  dependencies:
    - DB-ReadUserProfileStorage
  acceptanceCriteria:
    - 写入 localStorage 键名固定为 evoflow_user_profile。
    - 写入失败返回错误原因（storage_error）。
    - 写入成功后可被下一次读取回读。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"

- type: Database
  id: DB-UpsertUserProfile
  description: 更新个人信息并持久化（校验昵称/姓名/性别/生日）。
  dependencies:
    - DB-ReadUserProfileStorage
    - DB-WriteUserProfileStorage
  acceptanceCriteria:
    - nickname 必填且长度不超过 20 字符，否则返回 invalid_nickname。
    - name 必填且长度不超过 30 字符，否则返回 invalid_name。
    - name 不允许数字与特殊字符（允许中文/英文/空格/·），否则返回 invalid_name。
    - gender 必须为 男 或 女，否则返回 invalid_gender。
    - birthday 允许为空；非空时格式必须为 yyyy-MM-dd，否则返回 invalid_birthday。
    - birthday 非空且晚于当前日期时返回 invalid_birthday。
    - 当 nicknameStatus=reviewing 时，不允许修改 nickname（返回 forbidden）。
    - 写入成功后刷新 updatedAt（如字段存在）。
    - 写入失败返回 storage_error 并保留用户输入用于再次提交。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
    - date: "2026-01-19"
      description: "补充姓名合法字符与生日未来日期校验。"

- type: Database
  id: DB-UpdateUserProfile
  description: 在后端持久化层更新用户个人信息（支持乐观锁冲突检测）。
  dependencies:
    - DB-FindUserByAccount
  acceptanceCriteria:
    - 以鉴权上下文解析出的 userId 为更新目标，不允许跨用户更新。
    - nickname 必填且长度不超过 20 字符，否则返回 invalid_nickname。
    - name 必填且长度不超过 30 字符，且不允许数字与特殊字符，否则返回 invalid_name。
    - gender 必须为 男 或 女，否则返回 invalid_gender。
    - birthday 允许为空；非空时格式必须为 yyyy-MM-dd 且不得为未来日期，否则返回 invalid_birthday。
    - 当提供 profileVersion 时，若与当前记录版本不一致则返回 conflict（用于映射 HTTP 409）。
    - 当 nicknameStatus=reviewing 时，不允许修改 nickname（返回 forbidden）。
    - 更新成功后刷新 version 与 updatedAt。
  changeLog:
    - date: "2026-01-19"
      description: "初始创建。"
